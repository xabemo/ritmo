<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0b0f">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>Ritmo</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0b0f;
      color: #f5f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       CARGANDO
       ========================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0b0f;

      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* =========================
       ESTRUCTURA
       ========================= */

    .screen {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        30px
        20px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* =========================
       LOGIN
       ========================= */

    #loginScreen {
      display: none;

      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 42px;
    }

    .logo-mark {
      width: 74px;
      height: 74px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 23px;

      background:
        linear-gradient(
          145deg,
          #8b5cf6,
          #5b21b6
        );

      font-size: 34px;
      font-weight: 800;

      box-shadow:
        0 18px 45px
        rgba(124, 58, 237, .28);
    }

    .logo h1 {
      margin: 0;

      font-size: 40px;
      line-height: 1;

      letter-spacing: -1.8px;
    }

    .logo p {
      margin: 10px 0 0;

      color: #8e8e98;

      font-size: 15px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      color: #a1a1aa;

      font-size: 14px;
    }

    .field input {
      width: 100%;
      height: 56px;

      padding: 0 16px;

      border:
        1px solid
        #29292f;

      border-radius: 16px;

      outline: none;

      background: #17171c;
      color: #ffffff;

      font-size: 16px;

      -webkit-appearance: none;
    }

    .field input:focus {
      border-color: #8b5cf6;
    }

    .primary-button {
      width: 100%;
      height: 56px;

      margin-top: 7px;

      border: 0;
      border-radius: 16px;

      background: #8b5cf6;
      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      transition:
        transform .15s,
        opacity .15s;
    }

    .primary-button:active {
      transform: scale(.98);
    }

    .primary-button:disabled {
      opacity: .55;
    }

    .error {
      display: none;

      margin-top: 15px;
      padding: 13px 14px;

      border-radius: 14px;

      background: #32171b;
      color: #ff8c9a;

      font-size: 14px;
      line-height: 1.4;
    }

    /* =========================
       INICIO
       ========================= */

    #homeScreen {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 32px;
    }

    .greeting {
      margin-bottom: 4px;

      color: #8e8e98;

      font-size: 14px;
    }

    .user-name {
      font-size: 28px;
      font-weight: 700;

      letter-spacing: -.7px;
    }

    .avatar {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #202027;
      color: #c4b5fd;

      font-size: 18px;
      font-weight: 700;
    }

    .section-title {
      margin-bottom: 10px;

      color: #8e8e98;

      font-size: 13px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .empty-card {
      padding: 30px 20px;

      border:
        1px solid
        #24242b;

      border-radius: 22px;

      background: #15151a;

      text-align: center;
    }

    .empty-icon {
      margin-bottom: 12px;

      font-size: 38px;
    }

    .empty-card h2 {
      margin: 0 0 8px;

      font-size: 20px;
    }

    .empty-card p {
      margin: 0;

      color: #888892;

      line-height: 1.5;
    }

    /* =========================
       BOTONES RÁPIDOS
       ========================= */

    .quick-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-top: 20px;
    }

    .action {
      min-height: 125px;

      padding: 18px 15px;

      border:
        1px solid
        #29292f;

      border-radius: 19px;

      background: #19191f;
      color: #ffffff;

      text-align: left;
    }

    .action:active {
      transform: scale(.98);
    }

    .action-icon {
      margin-bottom: 10px;

      font-size: 25px;
    }

    .action-title {
      font-size: 17px;
      font-weight: 700;
    }

    .action-subtitle {
      margin-top: 4px;

      color: #888892;

      font-size: 12px;
    }

    /* =========================
       LOGOUT
       ========================= */

    .logout {
      width: 100%;
      height: 50px;

      margin-top: 35px;

      border:
        1px solid
        #29292f;

      border-radius: 15px;

      background: transparent;
      color: #9999a3;

      font-size: 14px;
    }

    /* =========================
       NAVIGACIÓN
       ========================= */

    #bottomNav {
      display: none;
    }

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 1000;

      height:
        calc(
          70px +
          env(safe-area-inset-bottom)
        );

      padding-bottom:
        env(safe-area-inset-bottom);

      display: flex;
      align-items: center;
      justify-content: space-around;

      background:
        rgba(14, 14, 18, .94);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-top:
        1px solid
        #24242b;
    }

    .nav-item {
      min-width: 70px;

      padding: 7px 12px;

      border: 0;

      background: transparent;
      color: #777780;

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    .nav-item.active {
      color: #a78bfa;
    }

  </style>
</head>


<body>

  <!-- =========================
       CARGANDO
       ========================= -->

<div id="loading">
  Ritmo
</div>


  <!-- =========================
       LOGIN
       ========================= -->

  <main
    id="loginScreen"
    class="screen"
  >

    <div class="login-box">

      <div class="logo">

        <div class="logo-mark">
          R
        </div>

        <h1>
          Ritmo
        </h1>

        <p>
          Control de tus actuaciones
        </p>

      </div>


      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="tu@email.com"
        >

      </div>


      <div class="field">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
        >

      </div>


      <button
        id="loginButton"
        class="primary-button"
      >
        Entrar
      </button>


      <div
        id="loginError"
        class="error"
      ></div>

    </div>

  </main>


  <!-- =========================
       INICIO
       ========================= -->

  <main
    id="homeScreen"
    class="screen"
  >

    <div class="topbar">

      <div>

        <div class="greeting">
          Buenos días
        </div>

        <div
          id="userName"
          class="user-name"
        >
          Músico
        </div>

      </div>


      <div
        id="avatar"
        class="avatar"
      >
        R
      </div>

    </div>


    <div class="section-title">
      PRÓXIMA ACTUACIÓN
    </div>


    <div class="empty-card">

      <div class="empty-icon">
        🎤
      </div>

      <h2>
        Aún no tienes bolos
      </h2>

      <p>
        Cuando añadas tu primera
        actuación aparecerá aquí.
      </p>

    </div>


    <div class="quick-actions">

      <button
        class="action"
        type="button"
      >

        <div class="action-icon">
          ＋
        </div>

        <div class="action-title">
          Bolo
        </div>

        <div class="action-subtitle">
          Añadir actuación
        </div>

      </button>


      <button
        class="action"
        type="button"
      >

        <div class="action-icon">
          €
        </div>

        <div class="action-title">
          Cobro
        </div>

        <div class="action-subtitle">
          Registrar dinero
        </div>

      </button>

    </div>


    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Cerrar sesión
    </button>

  </main>


  <!-- =========================
       NAVEGACIÓN
       ========================= -->

  <nav
    id="bottomNav"
    class="bottom-nav"
  >

    <button
      class="nav-item active"
      type="button"
    >
      🏠<br>
      Inicio
    </button>


    <button
      class="nav-item"
      type="button"
    >
      📅<br>
      Calendario
    </button>


    <button
      class="nav-item"
      type="button"
    >
      ⋯<br>
      Más
    </button>

  </nav>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    /*
      ==========================================================
      CONFIGURACIÓN SUPABASE
      ==========================================================
    */

    const SUPABASE_URL =
      'https://liovspyunqdfthcdjxzi.supabase.co';


    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_ciY-lcMXhggeBwdsbcrscw_LRYy_TdC';


    /*
      Creamos nuestro cliente con un nombre propio.
      Así evitamos confundirlo con la librería global
      de Supabase.
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /*
      ==========================================================
      ELEMENTOS
      ==========================================================
    */

    const loading =
      document.getElementById('loading');

    const loginScreen =
      document.getElementById('loginScreen');

    const homeScreen =
      document.getElementById('homeScreen');

    const bottomNav =
      document.getElementById('bottomNav');

    const loginButton =
      document.getElementById('loginButton');

    const loginError =
      document.getElementById('loginError');

    const logoutButton =
      document.getElementById('logoutButton');

    const emailInput =
      document.getElementById('email');

    const passwordInput =
      document.getElementById('password');

    const userName =
      document.getElementById('userName');

    const avatar =
      document.getElementById('avatar');


    /*
      ==========================================================
      MOSTRAR LOGIN
      ==========================================================
    */

    function showLogin() {

      loading.style.display = 'none';

      loginScreen.style.display = 'flex';

      homeScreen.style.display = 'none';

      bottomNav.style.display = 'none';

    }


    /*
      ==========================================================
      MOSTRAR INICIO
      ==========================================================
    */

    function showHome(profile, user) {

      loading.style.display = 'none';

      loginScreen.style.display = 'none';

      homeScreen.style.display = 'block';

      bottomNav.style.display = 'flex';


      const name =
        profile?.name ||
        user?.email ||
        'Músico';


      userName.textContent = name;


      avatar.textContent =
        name
          .charAt(0)
          .toUpperCase();

    }


    /*
      ==========================================================
      CARGAR PERFIL
      ==========================================================
    */

    async function loadProfile(user) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from('profiles')
          .select('name, role')
          .eq('id', user.id)
          .single();


      if (error) {

        console.error(
          'Error cargando perfil:',
          error
        );


        /*
          Aunque todavía no exista el perfil,
          permitimos continuar para poder
          detectar el problema.
        */

        showHome(
          {
            name: user.email
          },
          user
        );

        return;

      }


      console.log(
        'Perfil:',
        data
      );


      showHome(
        data,
        user
      );

    }


    /*
      ==========================================================
      LOGIN
      ==========================================================
    */

    async function login() {

      loginError.style.display =
        'none';


      const email =
        emailInput
          .value
          .trim();


      const password =
        passwordInput.value;


      if (
        !email ||
        !password
      ) {

        loginError.textContent =
          'Introduce tu email y contraseña.';

        loginError.style.display =
          'block';

        return;

      }


      loginButton.disabled =
        true;


      loginButton.textContent =
        'Entrando...';


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      if (error) {

        console.error(
          'Error de login:',
          error
        );


        loginError.textContent =
          'No se ha podido iniciar sesión. Comprueba el email y la contraseña.';

        loginError.style.display =
          'block';


        loginButton.disabled =
          false;


        loginButton.textContent =
          'Entrar';


        return;

      }


      await loadProfile(
        data.user
      );


      loginButton.disabled =
        false;


      loginButton.textContent =
        'Entrar';

    }


    /*
      ==========================================================
      CERRAR SESIÓN
      ==========================================================
    */

    async function logout() {

      await supabaseClient
        .auth
        .signOut();

      showLogin();

    }


    /*
      ==========================================================
      EVENTOS
      ==========================================================
    */

    loginButton.addEventListener(
      'click',
      login
    );


    logoutButton.addEventListener(
      'click',
      logout
    );


    passwordInput.addEventListener(
      'keydown',
      function(event) {

        if (
          event.key === 'Enter'
        ) {

          login();

        }

      }
    );


    /*
      ==========================================================
      COMPROBAR SESIÓN EXISTENTE
      ==========================================================
    */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        if (error) {

          console.error(
            'Error comprobando sesión:',
            error
          );

          showLogin();

          return;

        }


        if (
          data &&
          data.session &&
          data.session.user
        ) {

          await loadProfile(
            data.session.user
          );

        } else {

          showLogin();

        }

      }
      catch (error) {

        console.error(
          'Error inesperado:',
          error
        );

        showLogin();

      }

    }


    /*
      ==========================================================
      CAMBIOS DE AUTENTICACIÓN
      ==========================================================
    */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(
          event,
          session
        ) {

          if (
            session &&
            session.user
          ) {

            loadProfile(
              session.user
            );

          } else {

            showLogin();

          }

        }
      );


    /*
      ==========================================================
      ARRANCAR
      ==========================================================
    */

    checkSession();

  </script>

</body>
</html>

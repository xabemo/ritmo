    .login{min-height:100vh;background:var(--green);display:grid;grid-template-columns:1fr 1fr}.login-art{display:flex;align-items:center;justify-content:center;flex-direction:column;color:white}.login-art .logo{font-size:68px}.login-art p{opacity:.75}.login-card{background:var(--cream);align-self:center;margin:30px;padding:30px;border-radius:24px;max-width:430px}.login-card label{display:block;font-size:12px;font-weight:700;margin:14px 0}.login-card input{width:100%;padding:13px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.error{background:#f7dddd;color:#8b3434;padding:9px;border-radius:9px;font-size:12px;margin:10px 0}.splash{height:100vh;background:var(--green);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.splash .logo{font-size:62px}

<body>
<div id="root"></div>
<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);
const root=document.getElementById("root");
let session=null, view="home", projects=[], gigs=[], payments=[], passTypes=[], checklistItems=[], boloPasses=[], boloChecklist=[], kmPrices=[], currentMonth=new Date(), selectedDay=new Date().toISOString().slice(0,10);

function logo(){return `<div class="logo"><span class="staff">♪</span>Ritmo</div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#039;"}[m]))}
function money(v){return `${Number(v||0).toFixed(2).replace('.',',')} €`}
function header(){return `<header class="top">${logo()}<div class="ritmo-welcome" style="margin-left:auto;font-size:12px;font-weight:700;text-align:right">Buena actuación<span style="display:block;font-weight:500;opacity:.65">¡A por el bolo!</span></div></header>`}
function bottom(){const items=[['home','⌂','Inicio'],['calendar','▦','Calendario'],['bolos','♫','Bolos'],['more','•••','Más']];return `<nav class="bottom" aria-label="Navegación principal">${items.map(([id,icon,label])=>`<button class="${view===id||(id==='bolos'&&view==='gig')?'active':''}" onclick="go('${id}')" ${view===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}</nav><button class="fab fab1" onclick="modalBolo()">＋ Bolo</button><button class="fab fab2" onclick="modalCobro()">＋ Cobro</button>`}
function pageTitle(t,back=""){return `<div class="title">${back?`<button class="back" onclick="${back}">←</button>`:""}<h1>${t}</h1></div>`}
function go(v){view=v;render()}
function card(title,body,onclick=""){return `<section class="card" ${onclick?`onclick="${onclick}" style="cursor:pointer"`:''}><div class="card-head"><b>${title}</b><span class="arrow">${onclick?'›':''}</span></div>${body}</section>`}
function status(g){const paid=paymentTotalForBolo(g.id),total=Number(g.bolo_price||0);if(total>0&&paid>=total)return `<span class="status paid">Cobrado</span>`;if(paid>0)return `<span class="status partial">Parcial</span>`;return `<span class="status pending">Pendiente</span>`}
function boloStatusLabel(v){return v==='confirmado'?'Confirmado':v==='reserva'?'Reserva':v==='cancelado'?'Cancelado':v||''}
function boloStatusClass(v){return v==='reserva'?'reserve':v==='cancelado'?'pending':'paid'}
function projectById(id){return projects.find(p=>p.id===id)||{name:'Proyecto',color:'#7b4bb7',default_bolo_price:0}}
function paymentTotalForBolo(id){
 const g=gigs.find(x=>String(x.id)===String(id)); if(!g)return 0;
 const projectGenerated=gigs.filter(x=>x.project_id===g.project_id&&x.status!=='cancelado').reduce((n,x)=>n+Number(x.bolo_price||0),0);
 const projectPaid=paidForProject(g.project_id);
 if(projectGenerated<=0)return 0;
 const boloValue=Number(g.bolo_price||0);
 return Math.min(boloValue, projectPaid*(boloValue/projectGenerated));
}
function gigRow(g){const p=projectById(g.project_id);return `<button class="row-card" onclick="goGig('${g.id}')"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><span class="grow"><b>${esc(p.name)}</b><small>${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</small></span><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span><span class="arrow">›</span></button>`}

async function loadProjects(){
 const {data,error}=await db.from('projects').select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at').eq('user_id',session.user.id).order('name');
 if(error) throw error; projects=data||[];
}
async function loadGigs(){
 const {data,error}=await db.from('bolos').select('id,user_id,project_id,event_date,status,location,bolo_price,includes_travel,kilometers,returns_home,sleep_location,program_photo_url,observations,created_at,updated_at').eq('user_id',session.user.id).order('event_date');
 if(error){console.warn('No se pudieron cargar bolos:',error.message); gigs=[]; return;}
 gigs=data||[];
}
async function loadPayments(){const {data,error}=await db.from('payments').select('id,user_id,project_id,payment_date,amount,method,observations,created_at').eq('user_id',session.user.id).order('payment_date',{ascending:false});if(error){console.warn('No se pudieron cargar cobros:',error.message);payments=[];return}payments=data||[]}
async function loadExtras(){const [pt,ci,kp]=await Promise.all([db.from('pass_types').select('id,user_id,name,active,created_at').eq('user_id',session.user.id).eq('active',true).order('name'),db.from('checklist_items').select('id,user_id,name,position,active,created_at').eq('user_id',session.user.id).eq('active',true).order('position'),db.from('km_prices').select('id,user_id,effective_from,price_per_km,created_at').eq('user_id',session.user.id).order('effective_from',{ascending:false})]);passTypes=pt.data||[];checklistItems=ci.data||[];kmPrices=kp.data||[];if(pt.error)console.warn(pt.error.message);if(ci.error)console.warn(ci.error.message);if(kp.error)console.warn(kp.error.message);}
async function loadBoloExtras(boloId){const [bp,bc]=await Promise.all([db.from('bolo_passes').select('id,bolo_id,pass_number,start_time,end_time,pass_type_id,standard_type,created_at').eq('bolo_id',boloId).order('pass_number'),db.from('bolo_checklist').select('bolo_id,checklist_item_id,checked').eq('bolo_id',boloId)]);boloPasses=bp.data||[];boloChecklist=bc.data||[];if(bp.error)console.warn(bp.error.message);if(bc.error)console.warn(bc.error.message);}
function totalPaid(){return payments.reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedTotal(){return gigs.filter(g=>g.status!=='cancelado').reduce((n,g)=>n+Number(g.bolo_price||0),0)}
function paidForProject(projectId){return payments.filter(p=>p.project_id===projectId).reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedForProject(projectId){return gigs.filter(g=>g.project_id===projectId&&g.status!=='cancelado').reduce((n,g)=>n+Number(g.bolo_price||0),0)}
function owedForProject(projectId){return Math.max(0,generatedForProject(projectId)-paidForProject(projectId))}
function projectEconomyRows(){return projects.map(p=>{const generated=generatedForProject(p.id),paid=paidForProject(p.id),owed=Math.max(0,generated-paid);return `<div class="project"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><b>${esc(p.name)}</b><small>Generado ${money(generated)} · Cobrado ${money(paid)} · Me deben ${money(owed)}</small></div></div>`}).join('')}
function unassignedPaymentsTotal(){return payments.filter(p=>!p.project_id).reduce((n,p)=>n+Number(p.amount||0),0)}function currentYearCompletion(today=localDate()){
 const y=today.slice(0,4);
 const rows=gigs.filter(g=>String(g.event_date).slice(0,4)===String(y)&&g.status!=='cancelado');
 const total=rows.length,done=rows.filter(g=>g.status==='confirmado'&&g.event_date<today).length;
 return {total,done,pct:total?Math.round(done/total*100):0};
}
function projectStats(projectId, year){
 const rows=gigs.filter(g=>(!projectId||g.project_id===projectId)&&g.status!=='cancelado'&&(!year||String(g.event_date).slice(0,4)===String(year)));
 const generated=rows.reduce((n,g)=>n+Number(g.bolo_price||0),0);
 const paid=projectId?paidForProject(projectId):rows.reduce((n,g)=>n+0,0);
 const km=rows.reduce((n,g)=>n+Number(g.kilometers||0),0);
 return {rows,generated,paid:projectId?paid:0,owed:Math.max(0,generated-(projectId?paid:0)),km};
}
function activeKmPrice(date){
 const ds=date||localDate();
 return kmPrices.find(x=>x.effective_from<=ds)?.price_per_km||0;
}
function travelInfo(g){
 const km=Number(g?.kilometers||0), speed=Number(window.userSettings?.average_speed_kmh||0), margin=Number(window.userSettings?.departure_margin_minutes||0);
 const price=activeKmPrice(g?.event_date);
 const minutes=speed>0?Math.round((km/speed)*60):0;
 return {km,speed,margin,price,cost:km*Number(price||0),minutes,withMargin:minutes+margin};
}

function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function calendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();const first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';const today=localDate();const activeProject=window.calendarProjectFilter||'';for(let i=0;i<offset;i++)cells+='<span></span>';for(let d=1;d<=daysIn;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=gigs.some(g=>g.event_date===ds&&g.status!=='cancelado'&&(!activeProject||g.project_id===activeProject)),isSelected=selectedDay===ds;cells+=`<button class="${has?'has-event ':''}${ds===today?'today ':''}${isSelected?'selected':''}" onclick="selectDay('${ds}')">${d}</button>`}const label=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});const monthPrefix=`${y}-${String(m+1).padStart(2,'0')}`;const defaultDay=(selectedDay&&selectedDay.startsWith(monthPrefix))?selectedDay:(y===new Date().getFullYear()&&m===new Date().getMonth()?today:`${monthPrefix}-01`);if(selectedDay!==defaultDay)selectedDay=defaultDay;const projectOptions=projects.map(p=>`<option value="${p.id}" ${p.id===activeProject?'selected':''}>${esc(p.name)}</option>`).join('');return `${pageTitle('Calendario')}<div class="toolbar"><select onchange="setYear(this.value)">${[y-1,y,y+1].map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><select onchange="setCalendarProject(this.value)"><option value="">Todos los proyectos</option>${projectOptions}</select></div><div class="calendar"><div class="month"><button onclick="shiftMonth(-1)">‹</button><b>${label.charAt(0).toUpperCase()+label.slice(1)}</b><button onclick="shiftMonth(1)">›</button></div><div class="week">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div><div id="dayList">${dayList(defaultDay)}</div>`}
function setCalendarProject(id){window.calendarProjectFilter=id;render()}
function dayList(ds){const list=gigs.filter(g=>g.event_date===ds&&g.status!=='cancelado'&&(!window.calendarProjectFilter||g.project_id===window.calendarProjectFilter));return `<h3 style="margin:19px 2px 8px">${new Date(ds+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h3>${list.length?list.map(gigRow).join(''):'<p class="muted">No hay actuaciones este día.</p>'}`}
function selectDay(ds){selectedDay=ds;render()}
function shiftMonth(n){currentMonth.setMonth(currentMonth.getMonth()+n);const y=currentMonth.getFullYear(),m=currentMonth.getMonth();if(selectedDay&&!selectedDay.startsWith(`${y}-${String(m+1).padStart(2,'0')}`))selectedDay=`${y}-${String(m+1).padStart(2,'0')}-01`;render()}
function setYear(y){currentMonth.setFullYear(Number(y));render()}
function detail(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return pageTitle('Bolo');const p=projectById(g.project_id);const passes=boloPasses.filter(x=>x.bolo_id===g.id);const checks=checklistItems.map(i=>({item:i,checked:boloChecklist.find(x=>x.checklist_item_id===i.id)?.checked||false}));return `${pageTitle('Ficha de bolo',"go('bolos')")}<section class="detail"><div class="detail-top"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><h2>${esc(p.name)}</h2><div class="muted">${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</div></div><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span></div><div class="map"><div style="font-size:35px">⌖</div><b>${esc(g.location||'Ubicación pendiente')}</b><span class="small">${g.location?'Destino registrado':'Añade una ubicación para preparar la ruta'}</span></div><div class="economy"><h3>Mis cobros</h3><div class="line"><span>Actuación</span><b>${money(g.bolo_price)}</b></div><div class="line"><span>Desplazamiento</span><b>${g.includes_travel?'Incluido':'No incluido'}</b></div><div class="line"><span>Estado de cobro</span><b>${statusText(g)}</b></div></div>${(()=>{const t=travelInfo(g);return `<div class="card" style="box-shadow:none"><div class="card-head"><b>Desplazamiento</b></div><div class="line"><span>Tarifa vigente</span><b>${money(t.price)}/km</b></div><div class="line"><span>Coste estimado</span><b>${money(t.cost)}</b></div><div class="line"><span>Tiempo de viaje</span><b>${t.minutes?t.minutes+' min':'—'}</b></div><div class="line"><span>Salida recomendada</span><b>${t.minutes?new Date(g.event_date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · según horario del bolo':'Configura velocidad y horario de salida'}</b></div></div>`})()}<div class="card" style="box-shadow:none"><div class="line"><span>Kilómetros</span><b>${Number(g.kilometers||0).toLocaleString('es-ES')} km</b> async function toggleChecklist(boloId,itemId,checked){const existing=boloChecklist.find(x=>x.checklist_item_id===itemId&&x.bolo_id===boloId);let result;if(existing)result=await db.from('bolo_checklist').update({checked}).eq('bolo_id',boloId).eq('checklist_item_id',itemId);else result=await db.from('bolo_checklist').insert({bolo_id:boloId,checklist_item_id:itemId,checked});if(result.error)alert(`No se ha podido actualizar: ${result.error.message}`);else{await loadBoloExtras(boloId);render()}}
function modalChecklistItem(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Nueva tarea</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveChecklistItem(event)"><label>Tarea<input id="cname" maxlength="150" required></label><button class="primary">Guardar tarea</button><div id="checkError"></div></form></div></div>`)}
async function saveChecklistItem(e){e.preventDefault();const err=document.getElementById('checkError');const {error}=await db.from('checklist_items').insert({user_id:session.user.id,name:document.getElementById('cname').value.trim(),position:checklistItems.length,active:true});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadExtras();render()}
async function deleteChecklistItem(id){if(!confirm('¿Eliminar esta tarea?'))return;const {error}=await db.from('checklist_items').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadExtras();render()}

function modalPassTypes(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Tipos de pase</h2><button onclick="closeModal()">✕</button></div><div class="check">${passTypes.length?passTypes.map(t=>`<label><span class="grow">${esc(t.name)}</span><button class="mini danger" onclick="deletePassType('${t.id}')">×</button></label>`).join(''):'<p class="muted" style="padding:12px">No tienes tipos personalizados.</p>'}</div><form class="form" onsubmit="savePassType(event)"><label>Nuevo tipo<input id="ptname" maxlength="80" required></label><button class="primary">Añadir tipo</button><div id="ptError"></div></form></div></div>`)}
async function savePassType(e){e.preventDefault();const err=document.getElementById('ptError');const name=document.getElementById('ptname').value.trim();const {error}=await db.from('pass_types').insert({user_id:session.user.id,name,active:true});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await loadExtras();closeModal();render()}
async function deletePassType(id){if(!confirm('¿Eliminar este tipo de pase?'))return;const {error}=await db.from('pass_types').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadExtras();closeModal();render()}
function modalKmPrices(){const rows=kmPrices.map(k=>`<div class="line"><span>${esc(k.effective_from)}</span><b>${money(k.price_per_km)}/km</b></div>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Tarifas por km</h2><button onclick="closeModal()">✕</button></div>${rows||'<p class="muted">No hay tarifas configuradas.</p>'}<form class="form" onsubmit="saveKmPrice(event)"><label>Vigente desde<input id="kpdate" type="date" required></label><label>Precio por km<input id="kpprice" type="number" inputmode="decimal" min="0" step="0.0001" required></label><button class="primary">Guardar tarifa</button><div id="kpError"></div></form></div></div>`);document.getElementById('kpdate').value=new Date().toISOString().slice(0,10)}
async function saveKmPrice(e){e.preventDefault();const err=document.getElementById('kpError');const {error}=await db.from('km_prices').insert({user_id:session.user.id,effective_from:document.getElementById('kpdate').value,price_per_km:Number(document.getElementById('kpprice').value)});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await loadExtras();closeModal();render()}

function modalProject(id=''){const p=id?projects.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${p?'Editar proyecto':'Nuevo proyecto'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveProject(event,'${p?.id||''}')"><label>Nombre<input id="pname" required maxlength="120" value="${esc(p?.name||'')}"></label><label>Precio predeterminado del bolo<input id="pprice" type="number" inputmode="decimal" min="0" step="0.01" value="${p?.default_bolo_price??0}" required></label><label>Color<input id="pcolor" type="color" value="${p?.color||'#7b4bb7'}"></label><label>Estado<select id="pactive"><option value="true" ${p?.active!==false?'selected':''}>Activo</option><option value="false" ${p?.active===false?'selected':''}>Inactivo</option></select></label><button class="primary">${p?'Guardar cambios':'Crear proyecto'}</button><div id="projectError"></div></form></div></div>`) } 
async function saveProject(e,id=''){e.preventDefault();const err=document.getElementById('projectError');err.innerHTML='';const payload={name:document.getElementById('pname').value.trim(),color:document.getElementById('pcolor').value,default_bolo_price:Number(document.getElementById('pprice').value||0),active:document.getElementById('pactive').value==='true'};let q;if(id)q=db.from('projects').update(payload).eq('id',id).eq('user_id',session.user.id);else q=db.from('projects').insert({...payload,user_id:session.user.id});const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadProjects();render()}
async function deleteProject(id){const p=projects.find(x=>x.id===id);if(!p)return;if(!confirm(`¿Eliminar el proyecto «${p.name}»?\n\nSolo se podrá eliminar si no tiene bolos asociados.`))return;const {error}=await db.from('projects').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadProjects();render()}
function modalTravelSettings(){const existing=window.userSettings||{};document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Desplazamientos</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveTravelSettings(event)"><label>Domicilio<input id="shome" maxlength="250" value="${esc(existing.home_address||'')}"></label><label>Velocidad media (km/h)<input id="sspeed" type="number" inputmode="decimal" min="1" step="1" value="${existing.average_speed_kmh??90}"></label><label>Margen de salida (minutos)<input id="smargin" type="number" inputmode="decimal" min="0" step="5" value="${existing.departure_margin_minutes??30}"></label><p class="muted">El precio por km se gestiona con su histórico de tarifas.</p><button class="primary">Guardar configuración</button><div id="settingsError"></div></form></div></div>`)}
async function loadUserSettings(){const {data,error}=await db.from('user_settings').select('user_id,home_address,average_speed_kmh,departure_margin_minutes,created_at,updated_at').eq('user_id',session.user.id).maybeSingle();if(error){console.warn('No se pudieron cargar ajustes:',error.message);window.userSettings={};return}window.userSettings=data||{}}
async function saveTravelSettings(e){e.preventDefault();const err=document.getElementById('settingsError');err.innerHTML='';const payload={home_address:document.getElementById('shome').value.trim(),average_speed_kmh:Number(document.getElementById('sspeed').value||0),departure_margin_minutes:Number(document.getElementById('smargin').value||0),updated_at:new Date().toISOString()};let q=window.userSettings?.user_id?db.from('user_settings').update(payload).eq('user_id',session.user.id):db.from('user_settings').insert({...payload,user_id:session.user.id});const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await loadUserSettings();closeModal();render()}
function modalBolo(id=''){if(!projects.length){alert('Primero crea un proyecto.');go('projects');return}const g=id?gigs.find(x=>String(x.id)===String(id)):null;const activeProjects=projects.filter(p=>p.active||p.id===g?.project_id);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${g?'Editar bolo':'Añadir bolo'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveBolo(event,'${g?.id||''}')"><label>Proyecto<select id="bproject">${activeProjects.map(p=>`<option value="${p.id}" ${p.id===g?.project_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Fecha<input id="bdate" type="date" required value="${g?.event_date||''}"></label><label>Estado<select id="bstatus"><option value="confirmado" ${g?.status==='confirmado'?'selected':''}>Confirmado</option><option value="reserva" ${g?.status==='reserva'?'selected':''}>Reserva</option><option value="cancelado" ${g?.status==='cancelado'?'selected':''}>Cancelado</option></select></label><label>Ubicación<input id="blocation" maxlength="200" value="${esc(g?.location||'')}"></label><label>Precio del bolo<input id="bprice" type="number" inputmode="decimal" min="0" step="0.01" value="${g?.bolo_price??0}"></label><label>Kilómetros<input id="bkm" type="number" inputmode="decimal" min="0" step="0.1" value="${g?.kilometers??0}"></label><label>Desplazamiento<select id="btravel"><option value="false" ${!g?.includes_travel?'selected':''}>No</option><option value="true" ${g?.includes_travel?'selected':''}>Sí</option></select></label><label>Destino<select id="bhome"><option value="true" ${g?.returns_home!==false?'selected':''}>Volver a casa</option><option value="false" ${g?.returns_home===false?'selected':''}>Otra ubicación</option></select></label><label>Otra ubicación<input id="bsleep" maxlength="200" value="${esc(g?.sleep_location||'')}"></label><label>Observaciones<textarea id="bobs">${esc(g?.observations||'')}</textarea></label><button class="primary">${g?'Guardar cambios':'Guardar bolo'}</button><div id="boloError"></div></form></div></div>`);if(!g){const first=projects.find(p=>p.active);document.getElementById('bprice').value=first?.default_bolo_price||0;document.getElementById('bdate').value=localDate()}}
async function saveBolo(e,id=''){e.preventDefault();const err=document.getElementById('boloError');err.innerHTML='';const data={user_id:session.user.id,project_id:document.getElementById('bproject').value,event_date:document.getElementById('bdate').value,status:document.getElementById('bstatus').value,location:document.getElementById('blocation').value.trim(),bolo_price:Number(document.getElementById('bprice').value||0),includes_travel:document.getElementById('btravel').value==='true',kilometers:Number(document.getElementById('bkm').value||0),returns_home:document.getElementById('bhome').value==='true',sleep_location:document.getElementById('bsleep').value.trim(),observations:document.getElementById('bobs').value.trim()};const q=id?db.from('bolos').update(data).eq('id',id).eq('user_id',session.user.id):db.from('bolos').insert(data);const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadGigs();render()}
async function deleteBolo(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return;if(!confirm('¿Eliminar esta actuación?'))return;const {error}=await db.from('bolos').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}view='calendar';await loadGigs();render()}
function modalCobro(){const options=projects.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="savePayment(event)"><label>Proyecto<select id="payproject" required><option value="">Selecciona el proyecto</option>${options}</select></label><label>Importe<input id="payamount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>Fecha<input id="paydate" type="date" required></label><label>Método<select id="paymethod"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></label><label>Observaciones<textarea id="payobs"></textarea></label><button class="primary">Registrar cobro</button><div id="payError"></div></form></div></div>`);document.getElementById('paydate').value=localDate()}
async function savePayment(e){e.preventDefault();const err=document.getElementById('payError');err.innerHTML='';const projectId=document.getElementById('payproject').value;const {error}=await db.from('payments').insert({user_id:session.user.id,project_id:projectId,payment_date:document.getElementById('paydate').value,amount:Number(document.getElementById('payamount').value),method:document.getElementById('paymethod').value,observations:document.getElementById('payobs').value.trim()});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
function modalAssignPayment(id){const p=payments.find(x=>x.id===id);if(!p)return;const options=projects.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Asignar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="assignPayment(event,'${id}')"><p class="muted">${money(p.amount)} · ${esc(p.payment_date)}</p><label>Proyecto<select id="assignproject" required><option value="">Selecciona el proyecto</option>${options}</select></label><button class="primary">Asignar cobro</button><div id="assignError"></div></form></div></div>`)}
async function assignPayment(e,id){e.preventDefault();const err=document.getElementById('assignError');const {error}=await db.from('payments').update({project_id:document.getElementById('assignproject').value}).eq('id',id).eq('user_id',session.user.id);if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
async function deletePayment(id){if(!confirm('¿Eliminar este cobro?'))return;const {error}=await db.from('payments').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadPayments();render()}
function closeModal(){document.getElementById('modal')?.remove()}
async function logout(){await db.auth.signOut();session=null;projects=[];gigs=[];login()}
function login(){root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="loginSubmit(event)"><h1>Bienvenido</h1><p class="muted">Accede a tu cuenta de Ritmo.</p><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><div id="loginError"></div><button class="primary">Iniciar sesión</button></form></div>`}
async function loginSubmit(e){e.preventDefault();const err=document.getElementById('loginError');err.innerHTML='';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)err.innerHTML=`<div class="error">${esc(error.message)}</div>`}
async function start(){const {data}=await db.auth.getSession();session=data.session;if(!session){login();return}try{await loadProjects();await loadGigs();await loadPayments();await loadUserSettings();await loadExtras();render()}catch(e){root.innerHTML=`<div class="splash"><div class="logo">Ritmo</div><div class="error">No se han podido cargar los proyectos.<br>${esc(e.message)}</div></div>`}}
function syncModalViewport(){const vp=window.visualViewport;document.documentElement.style.setProperty('--modal-height',(vp?vp.height:window.innerHeight)+'px');document.documentElement.style.setProperty('--modal-top',(vp?vp.offsetTop:0)+'px')}
window.visualViewport?.addEventListener('resize',syncModalViewport);window.visualViewport?.addEventListener('scroll',syncModalViewport);syncModalViewport();
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)start();});start();
</script>
</body>
</html>

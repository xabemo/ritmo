<body>
<div id="root"></div>
<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);
const root=document.getElementById("root");
let session=null, view="home", projects=[], gigs=[], payments=[], expenses=[], passTypes=[], checklistItems=[], boloPasses=[], boloChecklist=[], homeNextPasses=[], kmPrices=[], currentMonth=new Date(), selectedDay=new Date().toISOString().slice(0,10);

function logo(){return `<div class="brand brand-image" aria-label="RITMO · Tu agenda musical"><img src="assets/ritmo-logo-editorial.png" alt="RITMO · Tu agenda musical"></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#039;"}[m]))}
function money(v){return `${Number(v||0).toFixed(2).replace('.',',')} €`}
function userInitials(){const n=window.userSettings?.display_name?.trim()||session?.user?.email?.split('@')[0]||'R';return n.split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('')}
function avatarButton(cls='top-avatar'){const url=window.userSettings?.avatar_url?.trim();return `<button class="${cls}" aria-label="Usuario" onclick="openUserMenu()">${url?`<img src="${esc(url)}" alt="">`:esc(userInitials())}</button>`}
function activityStorageKey(){return `ritmo_activity_seen_${session?.user?.id||'user'}`}
function activityLastSeen(){const raw=localStorage.getItem(activityStorageKey());if(!raw){const now=new Date().toISOString();localStorage.setItem(activityStorageKey(),now);return now}return raw}
function activityFeed(){const since=new Date(activityLastSeen()).getTime();const freshGigs=gigs.filter(g=>new Date(g.created_at||0).getTime()>since);const changedGigs=gigs.filter(g=>{const c=new Date(g.created_at||0).getTime(),u=new Date(g.updated_at||0).getTime();return u>since&&c<=since&&u>c+1000});const freshPayments=payments.filter(p=>new Date(p.created_at||0).getTime()>since);const out=[];if(freshGigs.length)out.push(['♫',`${freshGigs.length} bolo${freshGigs.length===1?' nuevo':'s nuevos'}`,freshGigs.length===1?'Se ha añadido una nueva actuación a RITMO.':'Se han añadido nuevas actuaciones a RITMO.']);if(freshPayments.length)out.push(['€',`${freshPayments.length} cobro${freshPayments.length===1?' registrado':'s registrados'}`,`Importe registrado: ${money(freshPayments.reduce((n,p)=>n+Number(p.amount||0),0))}`]);if(changedGigs.length)out.push(['↻',`${changedGigs.length} bolo${changedGigs.length===1?' actualizado':'s actualizados'}`,'Se han modificado datos de actuaciones existentes.']);return out}
function activityAlertCount(){return activityFeed().length}
function bellSvg(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>`}
function header(){const alerts=activityAlertCount();return `<header class="top"><button class="top-menu" aria-label="Abrir menú" onclick="openMainMenu()">☰</button>${logo()}<div class="top-right"><button class="top-bell" aria-label="${alerts?`${alerts} novedades`:'Sin novedades'}" onclick="openNotifications()">${bellSvg()}${alerts?'<span class="top-bell-dot"></span>':''}</button>${avatarButton()}</div></header>`}
function openNotifications(){const feed=activityFeed();localStorage.setItem(activityStorageKey(),new Date().toISOString());document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal activity-modal"><div class="modal-head"><div><h2>Notificaciones</h2><div class="muted">Actividad reciente en RITMO</div></div><button onclick="closeModal();render()">✕</button></div>${feed.length?`<div class="activity-list">${feed.map(x=>`<div class="activity-item"><span class="activity-icon">${x[0]}</span><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}</div>`:`<div class="activity-empty">✓<br><br>No hay novedades desde tu última visita.</div>`}</div></div>`)}
function openMainMenu(){const items=[['home','⌂','Inicio'],['calendar','▦','Calendario'],['bolos','♫','Bolos'],['reservations','◷','Reservas'],['economy','€','Mis cobros'],['expenses','↘','Gastos'],['map','⌖','Mapa'],['stats','▥','Estadísticas'],['projects','🎼','Proyectos'],['checklist','☑','Checklist'],['settings','⚙','Ajustes']];const n=window.userSettings?.display_name?.trim()||'Mi cuenta';document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="mainDrawer" onclick="if(event.target===this)closeMainMenu()"><aside class="drawer"><div class="drawer-head">${logo()}<button class="drawer-close" onclick="closeMainMenu()">✕</button></div><nav class="drawer-nav">${items.map(x=>`<button onclick="closeMainMenu();go('${x[0]}')"><span class="dn-icon">${x[1]}</span><span class="dn-label">${x[2]}</span><span>›</span></button>`).join('')}</nav><div class="drawer-user">${avatarButton()}<div><b>${esc(n)}</b><small>${esc(session?.user?.email||'Cuenta RITMO')}</small></div></div></aside></div>`)}
function closeMainMenu(){document.getElementById('mainDrawer')?.remove()}
function openUserMenu(){go('settings')}
function bottom(){const items=[['home','⌂','Inicio'],['calendar','▦','Calendario'],['bolos','♫','Bolos'],['more','•••','Más']];return `<nav class="bottom" aria-label="Navegación principal">${items.map(([id,icon,label])=>`<button class="${view===id||(id==='bolos'&&view==='gig')?'active':''}" onclick="go('${id}')" ${view===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}</nav><button class="fab fab1" onclick="modalBolo()">＋ Bolo</button><button class="fab fab2" onclick="modalCobro()">＋ Cobro</button>`}
function pageTitle(t,back=""){return `<div class="title">${back?`<button class="back" onclick="${back}">←</button>`:""}<h1>${t}</h1></div>`}
function go(v){view=v;render()}
function card(title,body,onclick=""){return `<section class="card" ${onclick?`onclick="${onclick}" style="cursor:pointer"`:''}><div class="card-head"><b>${title}</b><span class="arrow">${onclick?'›':''}</span></div>${body}</section>`}
function status(g){const paid=paymentTotalForBolo(g.id),total=boloAmounts(g).total;if(total>0&&paid>=total)return `<span class="status paid">Cobrado</span>`;if(paid>0)return `<span class="status partial">Parcial</span>`;return `<span class="status pending">Pendiente</span>`}
function boloStatusLabel(v){return v==='confirmado'?'Confirmado':v==='reserva'?'Reserva':v==='cancelado'?'Cancelado':v||''}
function boloStatusClass(v){return v==='reserva'?'reserve':v==='cancelado'?'pending':'paid'}
function projectById(id){return projects.find(p=>p.id===id)||{name:'Proyecto',color:'#7b4bb7',default_bolo_price:0}}
function paymentTotalForBolo(id){
 const g=gigs.find(x=>String(x.id)===String(id)); if(!g)return 0;
 if(g.status!=='confirmado')return 0;
 const projectGenerated=gigs.filter(x=>x.project_id===g.project_id&&x.status==='confirmado').reduce((n,x)=>n+boloAmounts(x).total,0);
 const exactPaid=payments.filter(p=>String(p.bolo_id||'')===String(id)).reduce((n,p)=>n+Number(p.amount||0),0);
 const legacyProjectPaid=payments.filter(p=>p.project_id===g.project_id&&!p.bolo_id).reduce((n,p)=>n+Number(p.amount||0),0);
 if(projectGenerated<=0)return 0;
 const boloValue=boloAmounts(g).total;
 return exactPaid+legacyProjectPaid*(boloValue/projectGenerated);
}
function paymentAllocationInfo(g){if(g?.status!=='confirmado')return 'No contabiliza';const exact=payments.filter(p=>String(p.bolo_id||'')===String(g.id)).length;if(exact)return 'Cobro asignado al bolo';const legacy=payments.some(p=>p.project_id===g.project_id&&!p.bolo_id);return legacy?'Estimación por proyecto':'Sin cobros registrados'}
function gigRow(g){const p=projectById(g.project_id),a=boloAmounts(g);const amountLabel=g.status==='reserva'?'Previsto':g.status==='cancelado'?'Cancelado':'Total';const displayTotal=g.status==='cancelado'?0:a.total;return `<button class="row-card" onclick="goGig('${g.id}')"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><span class="grow"><b>${esc(p.name)}</b><small>${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</small><span class="bolo-money">${amountLabel} <b>${money(displayTotal)}</b> · KM: <b>${g.includes_travel?'Sí':'No'}</b></span></span><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span><span class="arrow">›</span></button>`}

async function loadProjects(){
 const {data,error}=await db.from('projects').select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at').eq('user_id',session.user.id).order('name');
 if(error) throw error; projects=data||[];
}
async function loadGigs(){
 const {data,error}=await db.from('bolos').select('id,user_id,project_id,event_date,status,location,bolo_price,includes_travel,kilometers,returns_home,sleep_location,program_photo_url,travel_minutes,latitude,longitude,observations,created_at,updated_at').eq('user_id',session.user.id).order('event_date');
 if(error){console.warn('No se pudieron cargar bolos:',error.message); gigs=[]; return;}
 gigs=data||[];
}
async function loadExpenses(){const {data,error}=await db.from('expenses').select('id,user_id,project_id,bolo_id,expense_date,category,amount,observations').eq('user_id',session.user.id).order('expense_date',{ascending:false});expenses=data||[];if(error)console.warn(error.message)}
async function loadPayments(){const {data,error}=await db.from('payments').select('id,user_id,project_id,bolo_id,payment_date,amount,method,observations,created_at').eq('user_id',session.user.id).order('payment_date',{ascending:false});if(error){console.warn('No se pudieron cargar cobros:',error.message);payments=[];return}payments=data||[]}
async function loadExtras(){const [pt,ci,kp]=await Promise.all([db.from('pass_types').select('id,user_id,name,active,created_at').eq('user_id',session.user.id).eq('active',true).order('name'),db.from('checklist_items').select('id,user_id,name,position,active,created_at').eq('user_id',session.user.id).order('position'),db.from('km_prices').select('id,user_id,project_id,effective_from,price_per_km,created_at').eq('user_id',session.user.id).order('effective_from',{ascending:false})]);passTypes=pt.data||[];checklistItems=ci.data||[];kmPrices=kp.data||[];if(pt.error)console.warn(pt.error.message);if(ci.error)console.warn(ci.error.message);if(kp.error)console.warn(kp.error.message);}
async function loadBoloExtras(boloId){const [bp,bc]=await Promise.all([db.from('bolo_passes').select('id,bolo_id,pass_number,start_time,end_time,pass_type_id,standard_type,created_at').eq('bolo_id',boloId).order('pass_number'),db.from('bolo_checklist').select('bolo_id,checklist_item_id,checked').eq('bolo_id',boloId)]);boloPasses=bp.data||[];boloChecklist=bc.data||[];if(bp.error)console.warn(bp.error.message);if(bc.error)console.warn(bc.error.message);}
async function loadHomeNextPasses(){const g=nextGig();if(!g){homeNextPasses=[];return}const {data,error}=await db.from('bolo_passes').select('id,bolo_id,pass_number,start_time,end_time,pass_type_id,standard_type,created_at').eq('bolo_id',g.id).order('pass_number');if(error){console.warn('No se pudo cargar el primer pase del próximo bolo:',error.message);homeNextPasses=[];return}homeNextPasses=data||[]}
function totalPaid(){return payments.reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedTotal(){return gigs.reduce((n,g)=>n+economicBoloAmounts(g).total,0)}
function paidForProject(projectId){return payments.filter(p=>p.project_id===projectId).reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedForProject(projectId){return gigs.filter(g=>g.project_id===projectId).reduce((n,g)=>n+economicBoloAmounts(g).total,0)}
function owedForProject(projectId){return Math.max(0,generatedForProject(projectId)-paidForProject(projectId))}

ine"><span>Asignación de cobro</span><b>${paymentAllocationInfo(g)}</b></div></div>${(()=>{const t=travelInfo(g);return `<div class="card" style="box-shadow:none"><div class="card-head"><b>Desplazamiento</b></div><div class="line"><span>Tarifa vigente</span><b>${money(t.price)}/km</b></div><div class="line"><span>Coste estimado</span><b>${money(t.cost)}</b></div><div class="line"><span>Tiempo de viaje</span><b>${g.travel_minutes?g.travel_minutes+' min':(t.minutes?t.minutes+' min':'—')}</b></div><div class="line"><span>Salida recomendada</span><b>${(()=>{const r=departureRecommendation(g,passes);return r?r.departure+' · primer pase '+r.first:(t.minutes?'Añade un pase para calcularla':'Configura km y velocidad')})()}</b></div>${g.location?`<div class="route-actions"><button class="secondary" onclick="window.open('${mapsUrl(g)}','_blank')">⌖ Abrir ruta</button><button class="secondary" onclick="navigator.clipboard?.writeText('${esc(g.location)}')">Copiar destino</button></div>`:''}</div>`})()}<div class="card" style="box-shadow:none"><div class="line"><span>Kilómetros</span><b>${Number(g.kilometers||0).toLocaleString('es-ES')} km</b></div><div class="line"><span>Destino</span><b>${g.returns_home?'Volver a casa':esc(g.sleep_location||'Otra ubicación')}</b></div><div class="line"><span>Observaciones</span><b>${esc(g.observations||'—')}</b></div></div>${g.program_photo_url?`<div class="card" style="box-shadow:none"><div class="card-head"><b>Programa y archivos</b></div><p class="muted">${isHistoric?'Bolo finalizado · el archivo solo se carga cuando lo solicitas.':'Archivo adjunto a este bolo.'}</p><button class="primary" type="button" onclick="openProgramViewer('${g.id}')">Ver programa / archivo</button></div>`:``}<div class="card"><div class="card-head"><b>Pases</b><button class="mini" onclick="modalPass('${g.id}')">＋</button></div>${passes.length?passes.map(x=>`<div class="line"><span>Pase ${x.pass_number} · ${esc(passTypes.find(t=>t.id===x.pass_type_id)?.name||x.standard_type||'Otro')}</span><span><span class="pass-actions"><b>${esc((x.start_time||'').slice(0,5))}${x.end_time?' – '+esc(x.end_time.slice(0,5)):''}</b><button class="mini" onclick="modalPass('${g.id}','${x.id}')">✎</button><button class="mini danger" onclick="deletePass('${x.id}','${g.id}')">×</button></span></span></div>`).join(''):'<p class="muted">No hay pases añadidos.</p>'}</div><div class="card"><div class="card-head"><b>Checklist</b><span class="small">${checks.length?Math.round(checks.filter(x=>x.checked).length/checks.length*100):0}%</span></div>${checks.length?`<div class="check-progress"><progress value="${checks.filter(x=>x.checked).length}" max="${checks.length}"></progress><b>${checks.filter(x=>x.checked).length}/${checks.length}</b></div><div class="check">${checks.map(x=>`<label><input type="checkbox" ${x.checked?'checked':''} onchange="toggleChecklist('${g.id}','${x.item.id}',this.checked)"><span>${esc(x.item.name)}</span></label>`).join('')}</div>`:'<p class="muted">No hay elementos de checklist configurados.</p>'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="secondary" onclick="modalBolo('${g.id}')">✎ Editar</button><button class="secondary danger" onclick="deleteBolo('${g.id}')">Eliminar</button></div></section>`}

function economy(){const selected=window.economyProjectFilter||'',period=window.economyPeriod||'all',year=String(new Date().getFullYear()),matches=g=>!selected||g.project_id===selected,periodMatch=d=>period==='all'||period==='year'?String(d).slice(0,4)===year:String(d).slice(0,7)===period;const scopedGigs=gigs.filter(g=>g.status==='confirmado'&&matches(g)&&periodMatch(g.event_date));const scopedPayments=payments.filter(p=>matches(p)&&periodMatch(p.payment_date));const generated=scopedGigs.reduce((n,g)=>n+boloAmounts(g).total,0),paid=scopedPayments.reduce((n,p)=>n+Number(p.amount||0),0),owed=Math.max(0,generated-paid);const options=projects.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');const months=[...new Set(gigs.map(g=>String(g.event_date).slice(0,7)).filter(Boolean))].sort().reverse();const periodOptions=`<option value="all" ${period==='all'?'selected':''}>Todo el historial</option><option value="year" ${period==='year'?'selected':''}>${year}</option>${months.map(m=>`<option value="${m}" ${m===period?'selected':''}>${new Date(m+'-01T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</option>`).join('')}`;const relation=`<div class="economy-table"><table><thead><tr><th>Bolo</th><th>Importe</th><th>Cobrado</th><th>Pend.</th></tr></thead><tbody>${scopedGigs.map(g=>{const a=boloAmounts(g),p=projectById(g.project_id),pg=Math.min(a.total,paymentTotalForBolo(g.id));return `<tr><td class="bolo-cell"><b>${esc(p.name)}</b><small>${esc(g.event_date)}</small></td><td>${money(a.total)}</td><td>${money(pg)}</td><td>${money(Math.max(0,a.total-pg))}</td></tr>`}).join('')}</tbody></table></div>`;return `${pageTitle('Mis cobros')}<div class="toolbar"><select onchange="setEconomyProject(this.value)"><option value="">Todos los proyectos</option>${options}</select><select onchange="setEconomyPeriod(this.value)">${periodOptions}</select></div><div class="stats"><div class="stat"><span>Generado</span><strong>${money(generated)}</strong></div><div class="stat"><span>Cobrado</span><strong>${money(paid)}</strong></div><div class="stat" style="grid-column:1/-1"><span>Pendiente</span><strong>${money(owed)}</strong></div></div>${card('Relación por bolo',scopedGigs.length?relation:'<p class="muted">No hay bolos confirmados en este periodo.</p>')}${card('Cobros registrados',`${scopedPayments.length?scopedPayments.map(p=>`<div class="payment-row"><div class="payment-copy"><span>${esc(p.payment_date)} · ${esc(projectById(p.project_id).name||'Sin proyecto')}</span><small>${esc(p.method||'Sin método')}</small></div><b class="payment-amount">${money(p.amount)}</b><div class="payment-actions"><button class="mini" onclick="modalAssignPayment('${p.id}')">✎</button><button class="mini danger" onclick="deletePayment('${p.id}')">×</button></div></div>`).join(''):'<p class="muted">No hay cobros registrados.</p>'}<button class="primary" style="margin-top:10px" onclick="modalCobro()">＋ Registrar cobro</button>`)} `}

function bolosView(){
 const f=window.bolosFilter||'activos',project=window.bolosProject||'';
 const all=gigs.filter(g=>!project||g.project_id===project);
 const list=all.filter(g=>f==='cancelado'?g.status==='cancelado':g.status!=='cancelado').sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date)));
 const opts=[['activos','Confirmados y reservas'],['cancelado','Cancelados']];

 return `${pageTitle('Bolos')}<p class="muted page-intro">Todas tus fechas, en un mismo lugar.</p><button class="bolos-cobros-access" onclick="go('reservations')"><span><b>◷ Reservas</b><span>Gestionar y confirmar reservas rápidamente</span></span><span class="go">${all.filter(g=>g.status==='reserva').length} ›</span></button><div class="toolbar"><select aria-label="Filtrar bolos por proyecto" onchange="window.bolosProject=this.value;render()"><option value="">Todos los proyectos</option>${projects.map(p=>`<option value="${esc(p.id)}" ${p.id===project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="filter-chips" aria-label="Estado del bolo">${opts.map(([id,label])=>`<button class="mini ${f===id?'active':''}" aria-pressed="${f===id}" onclick="setBolosFilter('${id}')">${label} <span>${all.filter(g=>id==='cancelado'?g.status==='cancelado':g.status!=='cancelado').length}</span></button>`).join('')}</div>${f!=='cancelado'?`<section class="card bolo-summary"><div class="line"><span>${moneyRows.length} ${moneyRows.length===1?'bolo confirmado':'bolos confirmados'}</span><b>${money(totals.total)}</b></div><div class="line"><span>Cachés confirmados</span><b>${money(totals.cache)}</b></div><div class="line"><span>Desplazamientos confirmados</span><b>${money(totals.travel)}</b></div><div class="line total"><span>Total a cobrar</span><b>${money(totals.total)}</b></div></section>`:'<p class="muted">Los bolos cancelados no generan ningún importe.</p>'}<p class="muted">Ordenadas por fecha${f!=='cancelado'?' · el resumen respeta los filtros activos':''}</p>${list.length?list.map(g=>`<section class="gig-card">${gigRow(g)}${g.status==='reserva'?`<div class="reservation-actions"><button class="secondary" onclick="confirmReservation('${g.id}')">Confirmar reserva</button><button class="secondary danger" onclick="cancelReservation('${g.id}')">Cancelar</button></div>`:''}</section>`).join(''):'<div class="empty-state"><span aria-hidden="true">♫</span><h2>No hay function stats(){
 const year=Number(window.statsYear||new Date().getFullYear());
 const selected=window.statsProjectFilter||'';
 const s=projectStats(selected,year),prev=projectStats(selected,year-1);
 const scopedAll=gigs.filter(g=>(!selected||g.project_id===selected)&&String(g.event_date).slice(0,4)===String(year));
 const insights=statsInsights(scopedAll,year);
 const confirmed=scopedAll.filter(g=>g.status==='confirmado').length,reserves=scopedAll.filter(g=>g.status==='reserva').length,cancelled=scopedAll.filter(g=>g.status==='cancelado').length;
 const monthly=Array.from({length:12},(_,m)=>s.rows.filter(g=>g.status==='confirmado'&&new Date(g.event_date+'T12:00:00').getMonth()===m).reduce((n,g)=>n+boloAmounts(g).total,0));
 const maxMonth=Math.max(...monthly,1);
 const bars=monthly.map((v,i)=>`<div style="display:flex;align-items:flex-end;gap:5px;height:120px"><div title="${money(v)}" style="width:100%;height:${Math.max(5,Math.round(v/maxMonth*100))}%;background:var(--green2);border-radius:6px 6px 2px 2px"></div><small style="position:absolute;transform:translateY(64px);font-size:9px">${['E','F','M','A','M','J','J','A','S','O','N','D'][i]}</small></div>`).join('');
 const options=projects.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
 const years=[...new Set(gigs.map(g=>Number(String(g.event_date).slice(0,4))).filter(Boolean).concat([new Date().getFullYear()]))].sort((a,b)=>b-a);
 const change=pctChange(s.generated,prev.generated);
 const projectRows=projects.map(p=>{const x=projectStats(p.id,year);return `<div class="project-stat-row"><div class="project-stat-name"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><span>${esc(p.name)}</span></div><div class="project-stat-data"><b>${money(x.generated)}</b><small>${x.rows.length} ${x.rows.length===1?'bolo':'bolos'} · pendiente ${money(x.owed)}</small></div></div>`}).join('');
 return `${pageTitle('Estadísticas')}<div class="toolbar"><select onchange="setStatsProject(this.value)"><option value="">Todos los proyectos</option>${options}</select><select class="stats-year" onchange="setStatsYear(this.value)">${years.map(v=>`<option value="${v}" ${v===year?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="stats"><div class="stat"><span>Actuaciones · ${year}</span><strong>${s.rows.length}</strong><small class="muted">${prev.rows.length} en ${year-1}</small></div><div class="stat"><span>Kilómetros · ${year}</span><strong>${s.km.toLocaleString('es-ES')}</strong><small class="muted">${prev.km.toLocaleString('es-ES')} en ${year-1}</small></div><div class="stat"><span>Generado · ${year}</span><strong>${money(s.generated)}</strong><small class="year-compare ${change>=0?'positive':'negative'}">${change>=0?'+':''}${change}% vs ${year-1}</small></div><div class="stat"><span>Me deben · ${year}</span><strong>${money(s.owed)}</strong><small class="muted">Cobrado ${money(s.paid)}</small></div></div>
 ${card('Resumen del año',`<div class="insight-grid"><div class="insight"><span>Media por bolo</span><b>${money(insights.avg)}</b></div><div class="insight"><span>Mes con más bolos</span><b>${esc(insights.busiest)}${insights.busiestCount?` · ${insights.busiestCount}`:''}</b></div></div><div class="status-summary"><span>✓ ${confirmed} confirmados</span><span>◷ ${reserves} reservas</span><span>× ${cancelled} cancelados</span></div>`)}
 ${card('Ingresos por mes',`<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;position:relative">${bars}</div>`)}
 ${selected?card('Proyecto seleccionado',`<div class="line"><span>Generado</span><b>${money(s.generated)}</b></div><div class="line"><span>Cobrado</span><b>${money(s.paid)}</b></div><div class="line total"><span>Me deben</span><b>${money(s.owed)}</b></div>`):`<section class="card"><div class="card-head stats-card-title"><b>Por proyecto</b></div><div class="project-stat-list">${projectRows||'<p class="muted">No hay proyectos.</p>'}</div></section>`}`;
}

function modalExpense(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar gasto</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveExpense(event)"><label>Fecha<input id="edate" type="date" required></label><label>Categoría<select id="ecat"><option value="combustible">Combustible</option><option value="dietas">Dietas</option><option value="peajes">Peajes</option><option value="parking">Parking</option><option value="alojamiento">Alojamiento</option><option value="otros">Otros</option></select></label><label>Importe<input id="eamount" type="number" min="0.01" step="0.01" required></label><label>Proyecto<select id="eproject"><option value="">Sin proyecto</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Notas<textarea id="eobs"></textarea></label><button class="primary">Guardar gasto</button><div id="expenseError"></div></form></div></div>`);document.getElementById('edate').value=localDate()}
async function saveExpense(e){e.preventDefault();const {error}=await db.from('expenses').insert({user_id:session.user.id,project_id:document.getElementById('eproject').value||null,expense_date:document.getElementById('edate').value,category:document.getElementById('ecat').value,amount:Number(document.getElementById('eamount').value),observations:document.getElementById('eobs').value.trim()});if(error){document.getElementById('expenseError').innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadExpenses();render()}async function deleteExpense(id){if(!confirm('¿Eliminar gasto?'))return;await db.from('expenses').delete().eq('id',id).eq('user_id',session.user.id);await loadExpenses();render()}function checklist(){return `${pageTitle('Checklist')}<p class="muted">Plantilla de tareas para tus actuaciones. Puedes ordenar o desactivar tareas sin borrarlas.</p><button class="primary" onclick="modalChecklistItem()">＋ Añadir tarea</button>${checklistItems.length?`<div class="check" style="margin-top:12px">${checklistItems.map((i,n)=>`<label class="check-template-row ${i.active?'':'inactive-item'}"><button class="mini" onclick="toggleChecklistItemActive('${i.id}',${!i.active})">${i.active?'✓':'○'}</button><span class="grow">${esc(i.name)}<small style="display:block">${i.active?'Activa':'Inactiva'}</small></span><span class="check-template-actions"><button class="mini" ${n===0?'disabled':''} onclick="moveChecklistItem('${i.id}',-1)">↑</button><button class="mini" ${n===checklistItems.length-1?'disabled':''} onclick="moveChecklistItem('${i.id}',1)">↓</button><button class="mini danger" onclick="deleteChecklistItem('${i.id}')">×</button></span></label>`).join('')}</div>`:'<p class="muted" style="margin-top:18px">No tienes tareas configuradas.</p>'}`}

function mapview(){const rows=gigs.filter(g=>g.status!=='cancelado'&&g.location?.trim()).sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date)));const pending=rows.filter(g=>!Number.isFinite(Number(g.latitude))||!Number.isFinite(Number(g.longitude))).length;return `${pageTitle('Mapa')}<p class="muted page-intro">Tus bolos confirmados y reservas con ubicación.</p><div id="generalMap" class="map-canvas" role="region" aria-label="Mapa general de actuaciones"></div><p id="mapStatus" class="muted" style="margin:10px 2px">Cargando marcadores…</p>${pending?`<div class="map-pending-note">${pending} ${pending===1?'bolo antiguo está pendiente':'bolos antiguos están pendientes'} de coordenadas. No ralentizan el mapa; se actualizarán al editar y guardar su ubicación.</div>`:''}<div class="map-gig-list">${rows.length?rows.map(g=>`<button onclick="goGig('${g.id}')"><b>${esc(projectById(g.project_id).name)}</b><small>${esc(g.event_date)} · ${esc(g.location)}</small></button>`).join(''):'<p class="muted">Añade una ubicación a tus bolos para verlos aquí.</p>'}</div>`}
async function geocodeLocation(location){const key='ritmo-geocode:'+location.toLowerCase().trim();try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Number.isFinite(cached.lat)&&Number.isFinite(cached.lon))return cached}catch(_e){}const response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(location),{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('No se pudo localizar la dirección');const data=await response.json();if(!data?.[0])return null;const point={lat:Number(data[0].lat),lon:Number(data[0].lon)};try{localStorage.setItem(key,JSON.stringify(point))}catch(_e){}return point}
async function initGeneralMap(){if(view!=='map'||!window.L)return;const target=document.getElementById('generalMap');if(!target||target.dataset.ready)return;target.dataset.ready='1';const map=L.map(target,{scrollWheelZoom:false,preferCanvas:true}).setView([40.4168,-3.7038],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap',updateWhenIdle:true,keepBuffer:1}).addTo(map);const statusEl=document.getElementById('mapStatus');const rows=gigs.filter(g=>g.status!=='cancelado'&&g.location?.trim());const located=rows.filter(g=>Number.isFinite(Number(g.latitude))&&Number.isFinite(Number(g.longitude)));const pending=rows.length-located.length;if(!rows.length){statusEl.textContent='Añade una ubicación a tus bolos para verlos aquí.';return}if(!located.length){statusEl.textContent='No hay bolos con coordenadas guardadas todavía.';return}const cluster=typeof L.markerClusterGroup==='function'?L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,maxClusterRadius:48}):L.layerGroup();const bounds=[];for(const g of located){const lat=Number(g.latitude),lon=Number(g.longitude),p=projectById(g.project_id);const marker=L.circleMarker([lat,lon],{radius:9,color:p.color||'#7b4bb7',fillColor:p.color||'#7b4bb7',fillOpacity:.9,weight:2});marker.bindPopup(`<b>${esc(p.name)}</b><br>${esc(g.event_date)}<br>${esc(g.location)}<br><button onclick="goGig('${g.id}')">Ver bolo</button>`);cluster.addLayer(marker);bounds.push([lat,lon])}cluster.addTo(map);map.fitBounds(bounds,{padding:[28,28],maxZoom:12});statusEl.textContent=`${located.length} ${located.length===1?'bolo ubicado':'bolos ubicados'}${pending?` · ${pending} pendiente${pending===1?'':'s'} de coordenadas`:''}.`;}
function initMapsForView(){if(view==='map')setTimeout(initGeneralMap,0)}
function settingsPage(){return `${pageTitle('Ajustes')}<div class="settings"><button onclick="go('projects')"><span>🎼</span><span>Gestionar proyectos</span><span>›</span></button><button onclick="modalTravelSettings()"><span>⚙</span><span>Configuración de desplazamientos</span><span>›</span></button><button onclick="modalPassTypes()"><span>🎤</span><span>Tipos de pase</span><span>›</span></button><button onclick="modalKmPrices()"><span>🚗</span><span>Tarifas por km</span><span>›</span></button><button onclick="modalProfile()"><span>👤</span><span>Perfil</span><span>›</span></button></div><button class="secondary" style="margin-top:18px;width:100%" onclick="logout()">Cerrar sesión</button>`}

async function savePass(e,boloId,passId=''){e.preventDefault();const err=document.getElementById('passError');const type=document.getElementById('passtype').value;const payload={bolo_id:boloId,pass_number:Number(document.getElementById('passnum').value),start_time:document.getElementById('passstart').value,end_time:document.getElementById('passend').value||null,pass_type_id:null,standard_type:null};if(type.startsWith('__standard_'))payload.standard_type=type.replace('__standard_','');else payload.pass_type_id=type;const q=passId?db.from('bolo_passes').update(payload).eq('id',passId):db.from('bolo_passes').insert(payload);const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadBoloExtras(boloId);render()}

function programFileType(url=''){const clean=String(url).split('?')[0].toLowerCase();if(clean.endsWith('.pdf'))return 'pdf';if(/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(clean))return 'image';return 'unknown'}
function openProgramViewer(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g?.program_photo_url)return;closeModal();const url=g.program_photo_url,type=programFileType(url);const body=type==='pdf'?`<iframe src="${esc(url)}#toolbar=1&navpanes=0" title="Programa PDF"></iframe>`:type==='image'?`<img src="${esc(url)}" alt="Programa del bolo">`:`<div style="padding:24px;text-align:center"><p>No puedo previsualizar este formato dentro de RITMO.</p></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal program-viewer-modal"><div class="modal-head"><div><h2>Programa</h2><div class="muted">${esc(g.location||projectById(g.project_id).name)}</div></div><button onclick="closeModal()">✕</button></div><div class="program-viewer-body">${body}</div><div class="program-viewer-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><a class="secondary" target="_blank" rel="noopener" href="${esc(url)}">Abrir original ↗</a></div></div></div>`)}
function modalBolo(id=''){if(!projects.length){alert('Primero crea un proyecto.');go('projects');return}const g=id?gigs.find(x=>String(x.id)===String(id)):null;const activeProjects=projects.filter(p=>p.active||p.id===g?.project_id);const defaultId=g?.project_id||window.userSettings?.default_project_id||activeProjects[0]?.id||'';const selectedProject=projects.find(p=>p.id===defaultId);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${g?'Editar bolo':'Añadir bolo'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveBolo(event,'${g?.id||''}')"><label>Proyecto<select id="bproject" onchange="boloProjectChanged()">${activeProjects.map(p=>`<option value="${p.id}" ${p.id===defaultId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Fecha<input id="bdate" type="date" required value="${g?.event_date||''}" onchange="updateDateConflict('${g?.id||''}')"></label><label>Estado<select id="bstatus" onchange="updateDateConflict('${g?.id||''}')"><option value="confirmado" ${g?.status==='confirmado'?'selected':''}>Confirmado</option><option value="reserva" ${g?.status==='reserva'?'selected':''}>Reserva</option><option value="cancelado" ${g?.status==='cancelado'?'selected':''}>Cancelado</option></select></label><div id="dateConflict" class="conflict-box"></div><label>Ubicación<input id="blocation" maxlength="200" value="${esc(g?.location||'')}" oninput="updateBoloMapsButton()"></label><div class="route-actions"><button type="button" id="broute" class="secondary" onclick="calculateRouteFromForm()">⌖ Calcular ruta</button><button type="button" id="bmaps" class="secondary" onclick="openBoloRouteFromForm()">Abrir Maps</button></div><p id="routeResult" class="muted">Calcula km y tiempo desde tu domicilio.</p><label>Precio del bolo<input id="bprice" type="number" inputmode="decimal" min="0" step="0.01" value="${g?.bolo_price??selectedProject?.default_bolo_price??0}"></label><label>Kilómetros<input id="bkm" type="number" inputmode="decimal" min="0" step="0.1" value="${g?.kilometers??0}"></label><label>¿Cobrar desplazamiento aparte?<select id="btravel"><option value="false" ${!g?.includes_travel?'selected':''}>No</option><option value="true" ${g?.includes_travel?'selected':''}>Sí</option></select></label><p class="travel-charge-note">Si eliges Sí, el total a cobrar sumará kilómetros × tarifa vigente del proyecto.</p><label>Destino<select id="bhome"><option value="true" ${g?.returns_home!==false?'selected':''}>Volver a casa</option><option value="false" ${g?.returns_home===false?'selected':''}>Otra ubicación</option></select></label><label>Otra ubicación<input id="bsleep" maxlength="200" value="${esc(g?.sleep_location||'')}"></label><label>Programa, foto o documento<input id="bfile" type="file" accept="image/*,.pdf"></label>${g?.program_photo_url?`<button type="button" class="secondary" style="display:block;text-align:center;width:100%" onclick="openProgramViewer('${g.id}')">Ver archivo actual</button>`:''}<label>Observaciones<textarea id="bobs">${esc(g?.observations||'')}</textarea></label><button class="primary">${g?'Guardar cambios':'Guardar bolo'}</button><div id="boloError"></div></form></div></div>`);if(!g)document.getElementById('bdate').value=localDate();updateBoloMapsButton();updateDateConflict(g?.id||'')}
function updateDateConflict(editId=''){const box=document.getElementById('dateConflict'),date=document.getElementById('bdate')?.value,status=document.getElementById('bstatus')?.value;if(!box||!date)return;const rows=gigs.filter(g=>g.event_date===date&&g.status!=='cancelado'&&String(g.id)!==String(editId));if(!rows.length||status==='cancelado'){box.style.display='none';box.innerHTML='';return}const confirmed=rows.filter(g=>g.status==='confirmado'),reserved=rows.filter(g=>g.status==='reserva');const strong=status==='confirmado'&&confirmed.length>0;box.classList.toggle('strong',strong);box.style.display='block';box.innerHTML=`<b>${strong?'⚠ Conflicto de fecha':'◈ Fecha ocupada'}</b>${rows.map(g=>`${esc(projectById(g.project_id).name)} · ${esc(boloStatusLabel(g.status))}`).join('<br>')}<small style="display:block;margin-top:4px">Puedes guardar igualmente; RITMO no bloqueará la fecha.</small>`}
function boloProjectChanged(){const p=projects.find(x=>x.id===document.getElementById('bproject')?.value);if(p&&document.getElementById('bprice'))document.getElementById('bprice').value=Number(p.default_bolo_price||0).toFixed(2)}
function updateBoloMapsButton(){const loc=document.getElementById('blocation')?.value.trim();['bmaps','broute'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=!loc;b.style.opacity=loc?'1':'.55'}})}
async function calculateRouteFromForm(){const destination=document.getElementById('blocation')?.value.trim(),origin=window.userSettings?.home_address?.trim(),out=document.getElementById('routeResult');if(!destination||!origin){if(out)out.textContent='Configura el domicilio y la ubicación del bolo.';return}if(out)out.textContent='Calculando ruta…';try{const [a,b]=await Promise.all([geocodeLocation(origin),geocodeLocation(destination)]);if(!a||!b)throw Error();const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`),data=await r.json(),route=data.routes?.[0];if(!route)throw Error();const km=Math.round(route.distance/100)/10,min=Math.round(route.duration/60);document.getElementById('bkm').value=km;document.getElementById('broute').dataset.minutes=min;if(out)out.textContent=`${km.toLocaleString('es-ES')} km · ${min} min de conducción`}catch(_e){if(out)out.textContent='No se ha podido calcular la ruta. Revisa las direcciones.'}}
async function uploadBoloFile(file,boloId){if(!file)return null;const path=`${session.user.id}/${boloId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const {error}=await db.storage.from('ritmo-files').upload(path,file);if(error)throw error;return db.storage.from('ritmo-files').getPublicUrl(path).data.publicUrl}
function openBoloRouteFromForm(){const destination=document.getElementById('blocation')?.value.trim();if(!destination)return;const origin=window.userSettings?.home_address?.trim();if(!origin){alert('Configura primero tu domicilio en Ajustes → Configuración de desplazamientos.');return}window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=driving`,'_blank','noopener')}
async function saveBolo(e,id=''){e.preventDefault();const err=document.getElementById('boloError');err.innerHTML='';const location=document.getElementById('blocation').value.trim();const existing=id?gigs.find(g=>String(g.id)===String(id)):null;const locationChanged=!existing||String(existing.location||'').trim().toLowerCase()!==location.toLowerCase();let geo=null;if(location){if(!locationChanged&&Number.isFinite(Number(existing?.latitude))&&Number.isFinite(Number(existing?.longitude)))geo={lat:Number(existing.latitude),lon:Number(existing.longitude)};else try{geo=await geocodeLocation(location)}catch(_e){console.warn('No se pudo geolocalizar el destino al guardar')}}const data={user_id:session.user.id,project_id:document.getElementById('bproject').value,event_date:document.getElementById('bdate').value,status:document.getElementById('bstatus').value,location,latitude:geo?.lat??null,longitude:geo?.lon??null,bolo_price:Number(document.getElementById('bprice').value||0),includes_travel:document.getElementById('btravel').value==='true',kilometers:Number(document.getElementById('bkm').value||0),returns_home:document.getElementById('bhome').value==='true',sleep_location:document.getElementById('bsleep').value.trim(),travel_minutes:Number(document.getElementById('broute')?.dataset.minutes||0)||null,observations:document.getElementById('bobs').value.trim()};const q=id?db.from('bolos').update(data).eq('id',id).eq('user_id',session.user.id).select().single():db.from('bolos').insert(data).select().single();const {data:saved,error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}try{const url=await uploadBoloFile(document.getElementById('bfile')?.files?.[0],saved.id);if(url)await db.from('bolos').update({program_photo_url:url}).eq('id',saved.id).eq('user_id',session.user.id)}catch(e){err.innerHTML=`<div class="error">Bolo guardado, pero no se pudo subir el archivo: ${esc(e.message)}</div>`;return}closeModal();await loadGigs();await loadHomeNextPasses();render()}
async function deleteBolo(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return;if(!confirm('¿Eliminar esta actuación?'))return;const {error}=await db.from('bolos').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}view='calendar';await loadGigs();await loadHomeNextPasses();render()}
function paymentBoloOptions(projectId,selectedId=''){return gigs.filter(g=>g.status==='confirmado'&&g.project_id===projectId).sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date))).map(g=>`<option value="${g.id}" ${String(g.id)===String(selectedId)?'selected':''}>${esc(g.event_date)} · ${esc(g.location||projectById(g.project_id).name)} · ${money(boloAmounts(g).total)}</option>`).join('')}
function refreshPaymentBolos(selectId,projectId,selectedId=''){const el=document.getElementById(selectId);if(!el)return;el.innerHTML=`<option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(projectId,selectedId)}`}
function modalCobro(){const active=projects.filter(p=>p.active),first=active[0]?.id||'';const options=active.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="savePayment(event)"><label>Proyecto<select id="payproject" required onchange="refreshPaymentBolos('paybolo',this.value)"><option value="">Selecciona el proyecto</option>${options}</select></label><label>Bolo exacto <small class="muted">Opcional</small><select id="paybolo"><option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(first)}</select></label><p class="muted">Al seleccionar un bolo, este cobro se reflejará exactamente en su ficha. Los cobros sin bolo se distribuyen de forma proporcional dentro del proyecto.</p><label>Importe<input id="payamount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>Fecha<input id="paydate" type="date" required></label><label>Método<select id="paymethod"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></label><label>Observaciones<textarea id="payobs"></textarea></label><button class="primary">Registrar cobro</button><div id="payError"></div></form></div></div>`);document.getElementById('paydate').value=localDate();if(first)document.getElementById('payproject').value=first;refreshPaymentBolos('paybolo',first)}
async function savePayment(e){e.preventDefault();const err=document.getElementById('payError');err.innerHTML='';const projectId=document.getElementById('payproject').value,boloId=document.getElementById('paybolo').value||null;if(boloId&&!gigs.some(g=>String(g.id)===String(boloId)&&g.project_id===projectId&&g.status==='confirmado')){err.innerHTML='<div class="error">Selecciona un bolo confirmado del proyecto.</div>';return}const {error}=await db.from('payments').insert({user_id:session.user.id,project_id:projectId,bolo_id:boloId,payment_date:document.getElementById('paydate').value,amount:Number(document.getElementById('payamount').value),method:document.getElementById('paymethod').value,observations:document.getElementById('payobs').value.trim()});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
function modalAssignPayment(id){const p=payments.find(x=>x.id===id);if(!p)return;const available=projects.filter(x=>x.active||x.id===p.project_id),projectId=p.project_id||available[0]?.id||'';const options=available.map(x=>`<option value="${x.id}" ${x.id===projectId?'selected':''}>${esc(x.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Asignar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="assignPayment(event,'${id}')"><p class="muted">${money(p.amount)} · ${esc(p.payment_date)}</p><label>Proyecto<select id="assignproject" required onchange="refreshPaymentBolos('assignbolo',this.value)"><option value="">Selecciona el proyecto</option>${options}</select></label><label>Bolo exacto <small class="muted">Opcional</small><select id="assignbolo"><option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(projectId,p.bolo_id)}</select></label><p class="muted">Puedes dejarlo sin bolo para conservar la asignación proporcional por proyecto.</p><button class="primary">Guardar asignación</button><div id="assignError"></div></form></div></div>`);refreshPaymentBolos('assignbolo',projectId,p.bolo_id)}
async function assignPayment(e,id){e.preventDefault();const err=document.getElementById('assignError');const projectId=document.getElementById('assignproject').value,boloId=document.getElementById('assignbolo').value||null;if(boloId&&!gigs.some(g=>String(g.id)===String(boloId)&&g.project_id===projectId&&g.status==='confirmado')){err.innerHTML='<div class="error">Selecciona un bolo confirmado del proyecto.</div>';return}const {error}=await db.from('payments').update({project_id:projectId,bolo_id:boloId}).eq('id',id).eq('user_id',session.user.id);if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
async function deletePayment(id){if(!confirm('¿Eliminar este cobro?'))return;const {error}=await db.from('payments').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadPayments();render()}
function closeModal(){document.getElementById('modal')?.remove()}
async function logout(){await db.auth.signOut();session=null;projects=[];gigs=[];login()}
function login(){root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="loginSubmit(event)"><h1>Bienvenido</h1><p class="muted">Accede a tu cuenta de Ritmo.</p><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><div id="loginError"></div><button class="primary">Iniciar sesión</button></form></div>`}
async function loginSubmit(e){e.preventDefault();const err=document.getElementById('loginError');err.innerHTML='';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)err.innerHTML=`<div class="error">${esc(error.message)}</div>`}
async function start(){const {data}=await db.auth.getSession();session=data.session;if(!session){login();return}try{await loadProjects();await loadGigs();await loadPayments();await loadExpenses();await loadUserSettings();await loadExtras();await loadHomeNextPasses();render()}catch(e){root.innerHTML=`<div class="splash"><div class="logo">Ritmo</div><div class="error">No se han podido cargar los proyectos.<br>${esc(e.message)}</div></div>`}}
function syncModalViewport(){const vp=window.visualViewport;document.documentElement.style.setProperty('--modal-height',(vp?vp.height:window.innerHeight)+'px');document.documentElement.style.setProperty('--modal-top',(vp?vp.offsetTop:0)+'px')}
window.visualViewport?.addEventListener('resize',syncModalViewport);window.visualViewport?.addEventListener('scroll',syncModalViewport);syncModalViewport();
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)start();});start();
</script>
</body>
</html>

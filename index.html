<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Ritmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#173f35;--green2:#2e6b59;--cream:#f5f1e8;--card:#fffdf8;--purple:#7b4bb7;--yellow:#e5a82e;--red:#a44343;--muted:#6e7b76;--line:#dfe3dc}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:#18332d;font-family:"DM Sans",system-ui,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:105px}.top{height:70px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:#f5f1e8ee;backdrop-filter:blur(14px)}
    .logo{font-family:"Playfair Display",serif;font-size:32px;font-weight:600;letter-spacing:-1px;display:flex;align-items:center}.logo .staff{font-family:serif;color:var(--green2);font-size:27px;margin-right:-5px;transform:rotate(-8deg)}
    .icon{border:0;background:transparent;color:var(--green);padding:9px;border-radius:12px}.content{padding:7px 15px 25px}
    .hero,.card,.row-card,.detail,.calendar,.modal{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:0 5px 18px #173f350b}
    .hero{padding:18px;margin-bottom:12px;display:flex;gap:12px;justify-content:space-between}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--green2)}h1{font-size:26px;margin:4px 0 14px}h2{font-size:20px;margin:0 0 5px}h3{font-size:16px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.hero p{margin:6px 0;font-size:13px;color:var(--muted)}
    .status{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;height:max-content}.pending{background:#fff1d1;color:#a66a00}.paid{background:#def2e5;color:#2e7547}.partial{background:#fff3c9;color:#8a6b00}.reserve{background:#efe4fb;color:#6b3a99}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.quick button{border:0;border-radius:16px;color:white;padding:13px;text-align:left}.quick .b1{background:var(--green)}.quick .b2{background:#74519a}.quick b{display:block;font-size:17px}.quick span{font-size:11px;opacity:.8}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:20px;margin-top:4px}
    .card{padding:16px;margin:11px 0}.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.card-head b{flex:1}.card-head .arrow{color:#89938f}
    .distance{font-size:27px;font-weight:700}.small{font-size:11px;color:var(--muted)}
    .bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:76px;background:#fffdf8f2;border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:transparent;border:0;color:#7a8580;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom .active{color:var(--green);font-weight:700}
    .fab{position:fixed;z-index:19;bottom:88px;border:0;border-radius:999px;color:white;padding:11px 16px;font-weight:700;box-shadow:0 8px 20px #173f3530}.fab1{left:max(12px,calc(50% - 335px));background:var(--green)}.fab2{right:max(12px,calc(50% - 335px));background:#74519a}
    .title{display:flex;align-items:center;gap:6px;margin:9px 0 17px}.title h1{margin:0}.back{border:0;background:transparent;color:var(--green);padding:7px}
    .toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar>*{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green)}
    .calendar{padding:14px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.month button{border:0;background:transparent;font-size:24px;color:var(--green)}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week span{font-size:10px;color:var(--muted);padding:5px}.days button{height:37px;border:0;background:transparent;border-radius:50%;color:var(--green)}.days .selected{background:var(--green);color:#fff}
    .row-card{width:100%;display:flex;align-items:center;gap:10px;padding:13px;margin:8px 0;text-align:left;color:var(--green);border-style:solid}.dot{width:10px;height:10px;border-radius:50%;flex:none}.grow{flex:1}.row-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.row-card .arrow{color:#89938f}
    .detail{padding:16px}.detail-top{display:flex;align-items:center;gap:9px}.detail-top .grow{min-width:0}.map{height:205px;margin:14px 0;border-radius:15px;background:linear-gradient(135deg,#e4eadf,#cfdad0);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;color:var(--green)}.economy{background:#f0f4ee;border-radius:14px;padding:12px;margin:12px 0}.line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#60706a}.line b{color:var(--green)}.line.total{border-top:1px solid var(--line);font-weight:700}.primary{width:100%;padding:12px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700}.secondary{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green)}
    .menu button,.settings button{width:100%;display:flex;align-items:center;gap:11px;padding:15px;border:1px solid var(--line);background:var(--card);border-radius:15px;margin:8px 0;color:var(--green);text-align:left}.menu button span,.settings button span{flex:1}.quote{padding:28px;text-align:center;background:var(--green);color:white;border-radius:18px;margin-top:18px}
    .tabs{display:flex;gap:18px;overflow:auto;margin-bottom:13px}.tabs span,.tabs b{white-space:nowrap;padding-bottom:7px}.tabs b{border-bottom:2px solid var(--green)}
    .check label{display:flex;gap:11px;align-items:center;padding:14px;border-bottom:1px solid var(--line);background:var(--card)}.check{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:12px}.check input{width:18px;height:18px;accent-color:var(--green)}
    .map-big{height:58vh;min-height:360px;border-radius:19px;background:linear-gradient(135deg,#dfe7dd,#ccd8ce);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--green)}
    .project{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:8px 0}.project .grow b,.project .grow small{display:block}.project small{font-size:11px;color:var(--muted);margin-top:3px}
    .modal-bg{position:fixed;z-index:50;inset:0;background:#0b201a77;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(720px,100%);max-height:93vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal-head button{border:0;background:transparent;color:var(--green)}.form label{display:block;font-size:12px;font-weight:700;margin:12px 0}.form input,.form select,.form textarea{width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green)}.form textarea{min-height:80px}.preview{background:#eef3ed;border-radius:12px;padding:11px;margin:12px 0}.preview div{display:flex;justify-content:space-between;padding:4px;font-size:12px}
    .login{min-height:100vh;background:var(--green);display:grid;grid-template-columns:1fr 1fr}.login-art{display:flex;align-items:center;justify-content:center;flex-direction:column;color:white}.login-art .logo{font-size:68px}.login-art p{opacity:.75}.login-card{background:var(--cream);align-self:center;margin:30px;padding:30px;border-radius:24px;max-width:430px}.login-card label{display:block;font-size:12px;font-weight:700;margin:14px 0}.login-card input{width:100%;padding:13px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.error{background:#f7dddd;color:#8b3434;padding:9px;border-radius:9px;font-size:12px;margin:10px 0}.splash{height:100vh;background:var(--green);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.splash .logo{font-size:62px}
    @media(max-width:700px){.login{display:block}.login-art{min-height:36vh}.login-art .logo{font-size:50px}.login-card{margin:-20px 16px 0;position:relative}.fab1{left:12px}.fab2{right:12px}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);
const projects=[
 {id:1,name:"Orquesta Juniors",color:"#7b4bb7",displacement:true},
 {id:2,name:"Proyecto B",color:"#3d78c4",displacement:false},
 {id:3,name:"Proyecto C",color:"#4f9b61",displacement:true}
];
const gigs=[
 {id:1,date:"2026-09-26",time:"19:00",project:projects[0],town:"Calafell",type:"Concierto",price:175,km:82,kmPrice:.30,paid:0,confirmed:true,passes:1},
 {id:2,date:"2026-10-03",time:"21:00",project:projects[1],town:"Tarragona",type:"Baile",price:200,km:0,kmPrice:0,paid:0,confirmed:true,passes:1},
 {id:3,date:"2026-10-18",time:"",project:projects[0],town:"",type:"Otro",price:0,km:0,kmPrice:.30,paid:0,confirmed:false,passes:0}
];

const root=document.getElementById("root");
let session=null, view="home";

function logo(){return `<div class="logo"><span class="staff">♪</span>Ritmo</div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function header(){return `<header class="top">${logo()}<button class="icon" onclick="go('settings')">⚙</button></header>`}
function bottom(){
 return `<nav class="bottom">
  <button class="${view==="home"?"active":""}" onclick="go('home')">⌂<span>Inicio</span></button>
  <button class="${view==="calendar"?"active":""}" onclick="go('calendar')">▦<span>Calendario</span></button>
  <button class="${view==="more"?"active":""}" onclick="go('more')">•••<span>Más</span></button>
 </nav>
 <button class="fab fab1" onclick="modalBolo()">＋ Bolo</button>
 <button class="fab fab2" onclick="modalCobro()">€ Cobro</button>`
}
function pageTitle(t,back=""){return `<div class="title">${back?`<button class="back" onclick="${back}">←</button>`:""}<h1>${t}</h1></div>`}
function go(v){view=v;render()}
function card(title,body,onclick=""){return `<section class="card" ${onclick?`onclick="${onclick}" style="cursor:pointer"`:""}><div class="card-head"><b>${title}</b><span class="arrow">${onclick?"›":""}</span></div>${body}</section>`}
function status(g){
 const total=g.price+g.km*g.kmPrice, rest=Math.max(0,total-g.paid);
 return rest===0?`<span class="status paid">Cobrado</span>`:`<span class="status pending">Pendiente</span>`
}
function gigRow(g){
 return `<button class="row-card" onclick="goGig(${g.id})">
  <span class="dot" style="background:${g.project.color}"></span>
  <span class="grow"><b>${esc(g.project.name)}</b><small>${g.time||"Hora pendiente"} · ${g.town||"Ubicación pendiente"}</small></span>
  ${!g.confirmed?`<span class="status reserve">Reserva</span>`:status(g)}
  <span class="arrow">›</span>
 </button>`
}
function home(){
 return `<section class="hero">
   <div><div class="eyebrow">PRÓXIMO BOLO</div><h2>Orquesta Juniors</h2><p>◷ 26 septiembre · 19:00</p><p>⌖ Calafell</p></div><span class="status pending">Pendiente</span>
 </section>
 <div class="quick"><button class="b1" onclick="modalBolo()"><b>＋ Bolo</b><span>Añadir actuación</span></button><button class="b2" onclick="modalCobro()"><b>€ Cobro</b><span>Registrar pago</span></button></div>
 <div class="stats"><div class="stat" onclick="go('economy')"><span>Me deben</span><strong>1.250 €</strong></div><div class="stat" onclick="go('stats')"><span>Este año</span><strong>12 actuaciones</strong></div></div>
 ${card("Reservas próximas",`<div><span class="status reserve">Reserva</span> &nbsp;18 oct · Orquesta Juniors</div>`,`go('reservations')`)}
 ${card("Kilómetros",`<div class="distance">3.420 km</div><div class="small">≈ 0,085 vueltas al mundo 🌍</div>`)}
 `;
}
function calendar(){
 let days=Array.from({length:30},(_,i)=>`<button class="${i===11?"selected":""}">${i+1}</button>`).join("");
 return `${pageTitle("Calendario")}<div class="toolbar"><select><option>2026</option></select><select><option>Todos los proyectos</option></select></div>
 <div class="calendar"><div class="month"><button>‹</button><b>Septiembre 2026</b><button>›</button></div><div class="week">${["L","M","X","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}</div><div class="days">${days}</div></div>
 <h3 style="margin:19px 2px 8px">Sábado, 26 de septiembre</h3>${gigRow(gigs[0])}`;
}
function detail(id){
 const g=gigs.find(x=>x.id===id)||gigs[0], total=g.price+g.km*g.kmPrice, rest=Math.max(0,total-g.paid);
 return `${pageTitle("Ficha de bolo","go('calendar')")}
 <section class="detail"><div class="detail-top"><span class="dot" style="background:${g.project.color}"></span><div class="grow"><h2>${esc(g.project.name)}</h2><div class="muted">${g.date} · ${g.time||"Hora pendiente"}</div></div>${g.confirmed?status(g):`<span class="status reserve">Reserva</span>`}</div>
 <div class="map"><div style="font-size:35px">⌖</div><b>${g.town||"Ubicación pendiente"}</b><span class="small">Pin del bolo y bolos consecutivos</span></div>
 <div class="economy"><h3>Economía</h3><div class="line"><span>Actuación</span><b>${g.price.toFixed(2).replace(".",",")} €</b></div><div class="line"><span>Desplazamiento</span><b>${(g.km*g.kmPrice).toFixed(2).replace(".",",")} €</b></div><div class="line total"><span>Total generado</span><b>${total.toFixed(2).replace(".",",")} €</b></div><div class="line"><span>Cobrado</span><b>${g.paid.toFixed(2).replace(".",",")} €</b></div><div class="line total"><span>Pendiente</span><b>${rest.toFixed(2).replace(".",",")} €</b></div></div>
 <div class="card" style="box-shadow:none"><div class="line"><span>Tipo</span><b>${g.type}</b></div><div class="line"><span>Pases</span><b>${g.passes||"Pendientes"}</b></div><div class="line"><span>Kilómetros</span><b>${g.km||0} km</b></div><div class="line"><span>Salida estimada</span><b>${g.passes?"16:00":"—"}</b></div></div>
 <button class="primary" onclick="openRoute('${esc(g.town)}')">Abrir ruta</button></section>
 <div style="display:flex;justify-content:space-between;margin:11px 0"><button class="secondary">‹ Bolo anterior</button><button class="secondary">Bolo siguiente ›</button></div>`;
}
function more(){
 const items=[["economy","💶","Economía"],["reservations","📅","Reservas"],["projects","🎼","Proyectos"],["stats","▥","Estadísticas"],["checklist","☑","Checklist"],["map","⌖","Mapa"],["settings","⚙","Ajustes"]];
 return `${pageTitle("Más")}<div class="menu">${items.map(x=>`<button onclick="go('${x[0]}')"><span>${x[1]}</span><span>${x[2]}</span><span>›</span></button>`).join("")}</div><div class="quote">♪<br><br>“La música también se organiza.”</div>`;
}
function economy(){
 return `${pageTitle("Economía")}<div class="tabs"><b>Resumen</b><span>Cobros</span><span>Actuaciones</span><span>Exportar</span></div>
 <div class="stats"><div class="stat"><span>Me deben</span><strong>1.250 €</strong></div><div class="stat"><span>Generado este año</span><strong>8.450 €</strong></div><div class="stat"><span>Cobrado este año</span><strong>6.300 €</strong></div><div class="stat"><span>Pendiente</span><strong>2.150 €</strong></div></div>
 ${card("Desplazamientos generados",`<div class="distance">1.240,50 €</div><div class="small">Kilómetros con compensación económica</div>`)}
 ${card("Exportación económica",`<p class="muted">PDF centrado exclusivamente en importes, cobros y pendiente a fecha de consulta.</p><button class="primary" onclick="alert('En la siguiente fase conectaremos el generador PDF a los datos reales.')">Generar PDF</button>`)}
 ${card("Últimos cobros",`<div class="line"><span>25/09/2026 · Transferencia</span><b>500 €</b></div><div class="line"><span>14/09/2026 · Efectivo</span><b>300 €</b></div><div class="line"><span>02/09/2026 · Transferencia</span><b>750 €</b></div>`)}
 `;
}
function reservations(){
 return `${pageTitle("Reservas")}${gigs.filter(g=>!g.confirmed).map(g=>gigRow(g)).join("")}<p class="muted">Las reservas futuras se conservan hasta confirmar o cancelar. Una reserva cuya fecha ya haya pasado se cancela automáticamente.</p>`;
}
function stats(){
 return `${pageTitle("Estadísticas")}<div class="toolbar"><select><option>2026</option></select><button class="secondary">Comparar 2025</button></div><div class="stats"><div class="stat"><span>Actuaciones</span><strong>48</strong><small>+12% vs. 2025</small></div><div class="stat"><span>Kilómetros</span><strong>3.420</strong><small>+8% vs. 2025</small></div><div class="stat"><span>Desplazamientos</span><strong>1.240,50 €</strong></div><div class="stat"><span>Dinero generado</span><strong>8.450 €</strong></div></div>${card("Dato curioso",`<p>Llevas <b>3.420 km</b>, aproximadamente <b>0,085 vueltas al mundo</b>. 🌍</p>`)}${card("Año siguiente",`<p class="muted">Reservas 2027: <b>3</b></p>`)}`
}
function checklist(){
 const a=["Micrófono","Cableado","In-ear","Ropa","Cargadores","Agua","Documentación"];
 return `${pageTitle("Checklist")}<div class="check">${a.map((x,i)=>`<label><input type="checkbox" ${[0,1,4].includes(i)?"checked":""}>${x}</label>`).join("")}</div><button class="primary" onclick="alert('La lista será editable y guardada en Supabase en la siguiente fase.')">Editar checklist</button>`;
}
function mapview(){return `${pageTitle("Mapa")}<div class="map-big">⌖<b>Mapa general de actuaciones</b><span>Todos los bolos del año aparecerán aquí.</span></div>`}
function projectsview(){return `${pageTitle("Proyectos")}${projects.map(p=>`<div class="project"><span class="dot" style="background:${p.color}"></span><div class="grow"><b>${p.name}</b><small>${p.displacement?"Incluye desplazamiento":"Sin desplazamiento"}</small></div><span>›</span></div>`).join("")}`}
function settings(){return `${pageTitle("Ajustes")}<div class="settings">${["Perfil","Proyectos","Precios","Tipos de actuación","Margen de llegada","Cálculo de desplazamiento","Datos de Ritmo / Cuenta","Administración"].map(x=>`<button><span>⚙</span><span>${x}</span><span>›</span></button>`).join("")}</div><button class="secondary" style="margin-top:18px;width:100%" onclick="logout()">Cerrar sesión</button>`}
function shell(body){return `<div class="app">${header()}<main class="content">${body}</main>${bottom()}</div>`}

function render(){
 if(!session){root.innerHTML=`<div class="splash">${logo()}<span>Preparando Ritmo…</span></div>`;return}
 const pages={home,calendar,more,economy,reservations,stats,checklist,map:mapview,projects:projectsview,settings};
 root.innerHTML=shell(pages[view]?pages[view]():home());
}
function goGig(id){view="gig";root.innerHTML=shell(detail(id))}
function openRoute(town){if(!town)return;window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(town)," _blank")}
function modalBolo(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Añadir bolo</h2><button onclick="closeModal()">✕</button></div><div class="form">
 <label>Proyecto<select><option>Orquesta Juniors</option><option>Proyecto B</option><option>Proyecto C</option></select></label>
 <label>Fecha<input type="date" value="2026-09-26"></label>
 <label>Hora primer pase <input type="time"></label>
 <label>Tipo de actuación<select><option>Concierto</option><option>Baile</option><option>Marcha</option><option>Otro</option></select></label>
 <label>Pases <input type="number" min="0" max="4" placeholder="0"></label>
 <label>Pueblo / ubicación<input placeholder="Pueblo"></label>
 <label>Precio de actuación<input type="number" step="0.01" placeholder="Automático según proyecto"></label>
 <button class="primary" onclick="closeModal();alert('Formulario visual listo. En la siguiente fase guardará directamente en Supabase.')">Guardar bolo</button>
 </div></div></div>`);
}
function modalCobro(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar cobro</h2><button onclick="closeModal()">✕</button></div><div class="form">
 <label>Importe<input type="number" step="0.01" placeholder="500.00"></label>
 <label>Fecha<input type="date" value="2026-09-25"></label>
 <label>Método<select><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option></select></label>
 <label>Observaciones<textarea placeholder="Opcional"></textarea></label>
 <div class="preview"><div><span>Pendiente antes</span><b>1.250,00 €</b></div><div><span>Pendiente después</span><b>750,00 €</b></div></div>
 <button class="primary" onclick="closeModal();alert('Formulario visual listo. En la siguiente fase el cobro se repartirá automáticamente por antigüedad.')">Registrar cobro</button>
 </div></div></div>`);
}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove()}
async function logout(){await db.auth.signOut();session=null;render()}
function login(){
 root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="loginSubmit(event)"><h1>Bienvenido</h1><p class="muted">Accede a tu cuenta de Ritmo.</p><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><div id="loginError"></div><button class="primary">Iniciar sesión</button></form></div>`;
}
async function loginSubmit(e){e.preventDefault();const err=document.getElementById("loginError");err.innerHTML="";const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)err.innerHTML=`<div class="error">${esc(error.message)}</div>`}
db.auth.getSession().then(({data})=>{session=data.session;if(session)render();else login()});
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)render();});
</script>
</body>
</html>

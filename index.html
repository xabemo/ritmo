<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RITMO — Gestión de Bolos</title>
  
  <!-- Estilos base e interfaz visual -->
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 70px; /* Espacio para barra de navegación inferior en móviles */
    }

    /* Encabezado con Identidad Visual RITMO */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo span {
      color: var(--accent-color);
    }

    /* Contenedores de pantallas */
    main {
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    /* Formulario de Auth */
    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input, select, button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    button.btn-primary:hover {
      background-color: var(--accent-hover);
    }

    /* Lista de Proyectos */
    .project-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border-left: 4px solid var(--accent-color);
    }

    .project-info h3 {
      font-size: 1rem;
    }

    .project-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Navegación inferior tipo PWA / Móvil */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- SDK de Supabase JS oficial -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Carga de configuración local -->
  <script src="config.js"></script>
</head>
<body>

  <!-- Encabezado con Logotipo -->
  <header>
    <div class="brand-logo">
      RITMO <span>🎼</span>
    </div>
    <div id="user-status" class="hidden">
      <button onclick="cerrarSesion()" style="padding:0.4rem 0.8rem; font-size:0.8rem; width:auto;">Salir</button>
    </div>
  </header>

  <main>
    <!-- 1. PANTALLA DE INICIO DE SESIÓN -->
    <section id="auth-section" class="card">
      <h2>Iniciar Sesión</h2>
      <form id="login-form" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <p id="auth-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem;"></p>
    </section>

    <!-- 2. PANTALLA PRINCIPAL / INICIO -->
    <section id="dashboard-section" class="hidden">
      <div class="card">
        <h2>Próximo Bolo Principal</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;" id="main-bolo-placeholder">
          No hay bolos próximos confirmados.
        </p>
      </div>

      <!-- Sección de Proyectos Reales desde Supabase -->
      <div class="card">
        <h2>Mis Proyectos</h2>
        <div id="projects-list">
          <p style="color: var(--text-muted); font-size: 0.85rem;">Cargando proyectos...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Navegación Inferior (Móvil) -->
  <nav class="bottom-nav hidden" id="main-nav">
    <button class="nav-item active" onclick="mostrarSeccion('dashboard-section')">
      <span>🏠</span>
      <span>Inicio</span>
    </button>
    <button class="nav-item" onclick="alert('Sección Calendario en desarrollo')">
      <span>📅</span>
      <span>Calendario</span>
    </button>
    <button class="nav-item" onclick="alert('Sección Economía en desarrollo')">
      <span>💶</span>
      <span>Economía</span>
    </button>
  </nav>

  <!-- Lógica Principal en JavaScript -->
  <script>
    // Se ejecuta al cargar el DOM
    document.addEventListener('DOMContentLoaded', async () => {
      // Verificar conexión con config.js y Supabase
      if (typeof supabase === 'undefined') {
        alert('Error: No se ha podido cargar el cliente de Supabase. Revisa config.js');
        return;
      }

      // Comprobar la sesión del usuario actual
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        mostrarApp(session.user);
      } else {
        mostrarLogin();
      }

      // Escuchar cambios de autenticación
      supabase.auth.onAuthStateChange((_event, session) => {
        if (session) {
          mostrarApp(session.user);
        } else {
          mostrarLogin();
        }
      });
    });

    // Iniciar Sesión con Supabase Auth
    async function iniciarSesion(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('auth-error');
      
      errorEl.textContent = '';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorEl.textContent = 'Error al iniciar sesión: ' + error.message;
      }
    }

    // Cerrar Sesión
    async function cerrarSesion() {
      await supabase.auth.signOut();
    }

    // Mostrar vista de aplicación tras login exitoso
    function mostrarApp(user) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('main-nav').classList.remove('hidden');
      document.getElementById('user-status').classList.remove('hidden');

      // Cargar Proyectos reales filtrados por user_id (Paso 4 y 5)
      cargarProyectos(user.id);
    }

    // Mostrar vista de Login
    function mostrarLogin() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('main-nav').classList.add('hidden');
      document.getElementById('user-status').classList.add('hidden');
    }

    // Cargar proyectos de la tabla 'projects' desde Supabase
    async function cargarProyectos(userId) {
      const container = document.getElementById('projects-list');
      
      try {
        const { data: projects, error } = await supabase
          .from('projects')
          .select('*')
          .eq('user_id', userId)
          .eq('active', true);

        if (error) throw error;

        if (!projects || projects.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No tienes proyectos activos guardados.</p>';
          return;
        }

        // Renderizar lista de proyectos
        container.innerHTML = projects.map(p => `
          <div class="project-item" style="border-left-color: ${p.color || 'var(--accent-color)'};">
            <div class="project-info">
              <h3>${p.name}</h3>
              <p>Precio por defecto: ${p.default_bolo_price ? p.default_bolo_price + '€' : 'No definido'}</p>
            </div>
          </div>
        `).join('');

      </div> catch (err) {
        console.error('Error al cargar proyectos:', err.message);
        container.innerHTML = `<p style="color: var(--danger); font-size: 0.85rem;">Error al obtener proyectos de Supabase.</p>`;
      }
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Ritmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#173f35;--green2:#2e6b59;--cream:#f5f1e8;--card:#fffdf8;--purple:#7b4bb7;--yellow:#e5a82e;--red:#a44343;--muted:#6e7b76;--line:#dfe3dc}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:#18332d;font-family:"DM Sans",system-ui,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:105px}.top{height:70px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:#f5f1e8ee;backdrop-filter:blur(14px)}
    .logo{font-family:"Playfair Display",serif;font-size:32px;font-weight:600;letter-spacing:-1px;display:flex;align-items:center}.logo .staff{font-family:serif;color:var(--green2);font-size:27px;margin-right:-5px;transform:rotate(-8deg)}
    .icon{border:0;background:transparent;color:var(--green);padding:9px;border-radius:12px}.content{padding:7px 15px 25px}
    .hero,.card,.row-card,.detail,.calendar,.modal{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:0 5px 18px #173f350b}
    .hero{padding:18px;margin-bottom:12px;display:flex;gap:12px;justify-content:space-between}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--green2)}h1{font-size:26px;margin:4px 0 14px}h2{font-size:20px;margin:0 0 5px}h3{font-size:16px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.hero p{margin:6px 0;font-size:13px;color:var(--muted)}
    .status{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;height:max-content}.pending{background:#fff1d1;color:#a66a00}.paid{background:#def2e5;color:#2e7547}.partial{background:#fff3c9;color:#8a6b00}.reserve{background:#efe4fb;color:#6b3a99}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.quick button{border:0;border-radius:16px;color:white;padding:13px;text-align:left}.quick .b1{background:var(--green)}.quick .b2{background:#74519a}.quick b{display:block;font-size:17px}.quick span{font-size:11px;opacity:.8}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:20px;margin-top:4px}
    .card{padding:16px;margin:11px 0}.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.card-head b{flex:1}.card-head .arrow{color:#89938f}
    .distance{font-size:27px;font-weight:700}.small{font-size:11px;color:var(--muted)}
    .bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:76px;background:#fffdf8f2;border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:transparent;border:0;color:#7a8580;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom .active{color:var(--green);font-weight:700}
    .fab{position:fixed;z-index:19;bottom:88px;border:0;border-radius:999px;color:white;padding:11px 16px;font-weight:700;box-shadow:0 8px 20px #173f3530}.fab1{left:max(12px,calc(50% - 335px));background:var(--green)}.fab2{right:max(12px,calc(50% - 335px));background:#74519a}
    .title{display:flex;align-items:center;gap:6px;margin:9px 0 17px}.title h1{margin:0}.back{border:0;background:transparent;color:var(--green);padding:7px}
    .toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar>*{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green)}
    .calendar{padding:14px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.month button{border:0;background:transparent;font-size:24px;color:var(--green)}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week span{font-size:10px;color:var(--muted);padding:5px}.days button{height:37px;border:0;background:transparent;border-radius:50%;color:var(--green)}.days .selected{background:var(--green);color:#fff}
    .row-card{width:100%;display:flex;align-items:center;gap:10px;padding:13px;margin:8px 0;text-align:left;color:var(--green);border-style:solid}.dot{width:10px;height:10px;border-radius:50%;flex:none}.grow{flex:1}.row-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.row-card .arrow{color:#89938f}
    .detail{padding:16px}.detail-top{display:flex;align-items:center;gap:9px}.detail-top .grow{min-width:0}.map{height:205px;margin:14px 0;border-radius:15px;background:linear-gradient(135deg,#e4eadf,#cfdad0);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;color:var(--green)}.economy{background:#f0f4ee;border-radius:14px;padding:12px;margin:12px 0}.line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#60706a}.line b{color:var(--green)}.line.total{border-top:1px solid var(--line);font-weight:700}.primary{width:100%;padding:12px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700}.secondary{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green)}
    .menu button,.settings button{width:100%;display:flex;align-items:center;gap:11px;padding:15px;border:1px solid var(--line);background:var(--card);border-radius:15px;margin:8px 0;color:var(--green);text-align:left}.menu button span,.settings button span{flex:1}.quote{padding:28px;text-align:center;background:var(--green);color:white;border-radius:18px;margin-top:18px}
    .tabs{display:flex;gap:18px;overflow:auto;margin-bottom:13px}.tabs span,.tabs b{white-space:nowrap;padding-bottom:7px}.tabs b{border-bottom:2px solid var(--green)}
    .check label{display:flex;gap:11px;align-items:center;padding:14px;border-bottom:1px solid var(--line);background:var(--card)}.check{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:12px}.check input{width:18px;height:18px;accent-color:var(--green)}
    .map-big{height:58vh;min-height:360px;border-radius:19px;background:linear-gradient(135deg,#dfe7dd,#ccd8ce);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--green)}
    .project{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:8px 0}.project .grow b,.project .grow small{display:block}.project small{font-size:11px;color:var(--muted);margin-top:3px}.project-actions{display:flex;gap:6px}.mini{border:1px solid var(--line);background:var(--card);color:var(--green);border-radius:10px;padding:8px}.danger{color:var(--red)!important}
    .modal-bg{position:fixed;z-index:50;inset:0;background:#0b201a77;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(720px,100%);max-height:calc(100dvh - 12px);overflow:auto;overscroll-behavior:contain;border-radius:25px 25px 0 0;padding:18px;margin:0 auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal-head button{border:0;background:transparent;color:var(--green)}.form label{display:block;font-size:12px;font-weight:700;margin:12px 0}.form input,.form select,.form textarea{width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--green);font-size:16px}.form textarea{min-height:80px}.preview{background:#eef3ed;border-radius:12px;padding:11px;margin:12px 0}.preview div{display:flex;justify-content:space-between;padding:4px;font-size:12px}
    .login{min-height:100vh;background:var(--green);display:grid;grid-template-columns:1fr 1fr}.login-art{display:flex;align-items:center;justify-content:center;flex-direction:column;color:white}.login-art .logo{font-size:68px}.login-art p{opacity:.75}.login-card{background:var(--cream);align-self:center;margin:30px;padding:30px;border-radius:24px;max-width:430px}.login-card label{display:block;font-size:12px;font-weight:700;margin:14px 0}.login-card input{width:100%;padding:13px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.error{background:#f7dddd;color:#8b3434;padding:9px;border-radius:9px;font-size:12px;margin:10px 0}.splash{height:100vh;background:var(--green);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.splash .logo{font-size:62px}
    @media(max-width:700px){.modal{max-height:88dvh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.modal-bg{align-items:flex-end}.modal input,.modal select,.modal textarea{font-size:16px}}
    @media(max-width:700px){.login{display:block}.login-art{min-height:36vh}.login-art .logo{font-size:50px}.login-card{margin:-20px 16px 0;position:relative}.fab1{left:12px}.fab2{right:12px}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);
const root=document.getElementById("root");
let session=null, view="home", projects=[], gigs=[], payments=[], currentMonth=new Date();

function logo(){return `<div class="logo"><span class="staff">♪</span>Ritmo</div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#039;"}[m]))}
function money(v){return `${Number(v||0).toFixed(2).replace('.',',')} €`}
function header(){return `<header class="top">${logo()}<button class="icon" onclick="go('settings')">⚙</button></header>`}
function bottom(){return `<nav class="bottom"><button class="${view==='home'?'active':''}" onclick="go('home')">⌂<span>Inicio</span></button><button class="${view==='calendar'?'active':''}" onclick="go('calendar')">▦<span>Calendario</span></button><button class="${view==='more'?'active':''}" onclick="go('more')">•••<span>Más</span></button></nav><button class="fab fab1" onclick="modalBolo()">＋ Bolo</button><button class="fab fab2" onclick="modalCobro()">€ Cobro</button>`}
function pageTitle(t,back=""){return `<div class="title">${back?`<button class="back" onclick="${back}">←</button>`:""}<h1>${t}</h1></div>`}
function go(v){view=v;render()}
function card(title,body,onclick=""){return `<section class="card" ${onclick?`onclick="${onclick}" style="cursor:pointer"`:''}><div class="card-head"><b>${title}</b><span class="arrow">${onclick?'›':''}</span></div>${body}</section>`}
function status(g){const paid=paymentTotalForBolo(g.id),total=Number(g.bolo_price||0);if(total>0&&paid>=total)return `<span class="status paid">Cobrado</span>`;if(paid>0)return `<span class="status partial">Parcial</span>`;return `<span class="status pending">Pendiente</span>`}
function boloStatusLabel(v){return v==='confirmado'?'Confirmado':v==='reserva'?'Reserva':v==='cancelado'?'Cancelado':v||''}
function boloStatusClass(v){return v==='reserva'?'reserve':v==='cancelado'?'pending':'paid'}
function projectById(id){return projects.find(p=>p.id===id)||{name:'Proyecto',color:'#7b4bb7',default_bolo_price:0}}
function paymentTotalForBolo(id){return 0}
function gigRow(g){const p=projectById(g.project_id);return `<button class="row-card" onclick="goGig('${g.id}')"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><span class="grow"><b>${esc(p.name)}</b><small>${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</small></span><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span><span class="arrow">›</span></button>`}

async function loadProjects(){
 const {data,error}=await db.from('projects').select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at').eq('user_id',session.user.id).order('name');
 if(error) throw error; projects=data||[];
}
async function loadGigs(){
 const {data,error}=await db.from('bolos').select('id,user_id,project_id,event_date,status,location,bolo_price,includes_travel,kilometers,returns_home,sleep_location,program_photo_url,observations,created_at,updated_at').eq('user_id',session.user.id).order('event_date');
 if(error){console.warn('No se pudieron cargar bolos:',error.message); gigs=[]; return;}
 gigs=data||[];
}
async function loadPayments(){const {data,error}=await db.from('payments').select('id,user_id,payment_date,amount,method,observations,created_at').eq('user_id',session.user.id).order('payment_date',{ascending:false});if(error){console.warn('No se pudieron cargar cobros:',error.message);payments=[];return}payments=data||[]}
function totalPaid(){return payments.reduce((n,p)=>n+Number(p.amount||0),0)}
function nextGig(){const today=new Date().toISOString().slice(0,10);return gigs.filter(g=>g.event_date>=today&&g.status!=='cancelled').sort((a,b)=>a.event_date.localeCompare(b.event_date))[0]}
function home(){
 const g=nextGig(); const p=g?projectById(g.project_id):null; const km=gigs.reduce((n,x)=>n+Number(x.kilometers||0),0); const generated=gigs.reduce((n,x)=>n+Number(x.bolo_price||0),0); const owed=Math.max(0,generated-totalPaid());
 return `${g?`<section class="hero"><div><div class="eyebrow">PRÓXIMO BOLO</div><h2>${esc(p.name)}</h2><p>◷ ${esc(g.event_date)}</p><p>⌖ ${esc(g.location||'Ubicación pendiente')}</p></div><span class="status ${g.status==='reserva'?'reserve':'pending'}">${g.status==='reserva'?'Reserva':'Confirmado'}</span></section>`:`<section class="hero"><div><div class="eyebrow">RITMO</div><h2>Empieza a organizar tus bolos</h2><p>${projects.length?'Ya tienes proyectos. Añade tu primera actuación.':'Crea tu primer proyecto para empezar.'}</p></div></section>`}
 <div class="quick"><button class="b1" onclick="modalBolo()"><b>＋ Bolo</b><span>Añadir actuación</span></button><button class="b2" onclick="modalCobro()"><b>€ Cobro</b><span>Registrar pago</span></button></div>
 <div class="stats"><div class="stat" onclick="go('economy')"><span>Generado</span><strong>${money(generated)}</strong></div><div class="stat"><span>Kilómetros</span><strong>${km.toLocaleString('es-ES')}</strong></div></div>
 ${card('Proyectos',projects.length?projects.slice(0,3).map(p=>`<div class="project"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><b>${esc(p.name)}</b><small>${money(p.default_bolo_price)} por defecto</small></div></div>`).join(''):`<p class="muted">Todavía no tienes proyectos.</p><button class="primary" onclick="modalProject()">＋ Crear proyecto</button>`,`go('projects')`)}
 ${g?card('Próximas actuaciones',gigs.filter(x=>x.event_date>=new Date().toISOString().slice(0,10)&&x.status!=='cancelled').slice(0,3).map(gigRow).join('')):''}`}
function calendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();const first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let cells='';for(let i=0;i<offset;i++)cells+='<span></span>';for(let d=1;d<=daysIn;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=gigs.some(g=>g.event_date===ds&&g.status!=='cancelled');cells+=`<button class="${has?'selected':''}" onclick="selectDay('${ds}')">${d}</button>`}const label=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});return `${pageTitle('Calendario')}<div class="toolbar"><select onchange="setYear(this.value)">${[y-1,y,y+1].map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><select><option>Todos los proyectos</option></select></div><div class="calendar"><div class="month"><button onclick="shiftMonth(-1)">‹</button><b>${label.charAt(0).toUpperCase()+label.slice(1)}</b><button onclick="shiftMonth(1)">›</button></div><div class="week">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div><div id="dayList">${dayList(`${y}-${String(m+1).padStart(2,'0')}-01`)}</div>`}
function dayList(ds){const list=gigs.filter(g=>g.event_date===ds&&g.status!=='cancelled');return `<h3 style="margin:19px 2px 8px">${new Date(ds+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h3>${list.length?list.map(gigRow).join(''):'<p class="muted">No hay actuaciones este día.</p>'}`}
function selectDay(ds){const el=document.getElementById('dayList');if(el)el.innerHTML=dayList(ds)}
function shiftMonth(n){currentMonth.setMonth(currentMonth.getMonth()+n);render()}
function setYear(y){currentMonth.setFullYear(Number(y));render()}
function detail(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return pageTitle('Bolo');const p=projectById(g.project_id);return `${pageTitle('Ficha de bolo',"go('calendar')")}<section class="detail"><div class="detail-top"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><h2>${esc(p.name)}</h2><div class="muted">${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</div></div><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span></div><div class="map"><div style="font-size:35px">⌖</div><b>${esc(g.location||'Ubicación pendiente')}</b><span class="small">Ruta y mapa se integrarán en la siguiente fase</span></div><div class="economy"><h3>Economía</h3><div class="line"><span>Actuación</span><b>${money(g.bolo_price)}</b></div><div class="line"><span>Desplazamiento</span><b>${g.includes_travel?'Incluido':'No incluido'}</b></div><div class="line"><span>Estado de cobro</span><b>${statusText(g)}</b></div></div><div class="card" style="box-shadow:none"><div class="line"><span>Kilómetros</span><b>${Number(g.kilometers||0).toLocaleString('es-ES')} km</b></div><div class="line"><span>Destino</span><b>${g.returns_home?'Volver a casa':esc(g.sleep_location||'Otra ubicación')}</b></div><div class="line"><span>Observaciones</span><b>${esc(g.observations||'—')}</b></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="secondary" onclick="modalBolo('${g.id}')">✎ Editar</button><button class="secondary danger" onclick="deleteBolo('${g.id}')">Eliminar</button></div></section>`}
function statusText(g){const paid=paymentTotalForBolo(g.id),total=Number(g.bolo_price||0);if(total>0&&paid>=total)return 'Cobrado';if(paid>0)return 'Parcial';return 'Pendiente'}
function goGig(id){view='gig';root.innerHTML=shell(detail(id))}
function more(){const items=[['economy','💶','Economía'],['reservations','📅','Reservas'],['projects','🎼','Proyectos'],['stats','▥','Estadísticas'],['checklist','☑','Checklist'],['map','⌖','Mapa'],['settings','⚙','Ajustes']];return `${pageTitle('Más')}<div class="menu">${items.map(x=>`<button onclick="go('${x[0]}')"><span>${x[1]}</span><span>${x[2]}</span><span>›</span></button>`).join('')}</div><div class="quote">♪<br><br>“La música también se organiza.”</div>`}
function projectsView(){return `${pageTitle('Proyectos')}<button class="primary" onclick="modalProject()">＋ Crear proyecto</button>${projects.length?projects.map(p=>`<div class="project"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><b>${esc(p.name)}</b><small>${money(p.default_bolo_price)} · ${p.active?'Activo':'Inactivo'}</small></div><div class="project-actions"><button class="mini" onclick="modalProject('${p.id}')">✎</button><button class="mini danger" onclick="deleteProject('${p.id}')">×</button></div></div>`).join(''):'<p class="muted" style="margin-top:18px">No tienes proyectos. Crea el primero para empezar.</p>'}`}
function economy(){const generated=gigs.reduce((n,g)=>n+Number(g.bolo_price||0),0),paid=totalPaid(),owed=Math.max(0,generated-paid);return `${pageTitle('Economía')}<div class="stats"><div class="stat"><span>Generado</span><strong>${money(generated)}</strong></div><div class="stat"><span>Cobrado</span><strong>${money(paid)}</strong></div><div class="stat"><span>Me deben</span><strong>${money(owed)}</strong></div></div>${card('Cobros',`${payments.length?payments.map(p=>`<div class="line"><span>${esc(p.payment_date)} · ${esc(p.method||'')}</span><span><b>${money(p.amount)}</b> <button class="mini danger" onclick="deletePayment('${p.id}')">×</button></span></div>`).join(''):'<p class="muted">Todavía no hay cobros registrados.</p>'}<button class="primary" style="margin-top:10px" onclick="modalCobro()">＋ Registrar cobro</button>`)}`}
function reservations(){const r=gigs.filter(g=>g.status==='reserva'&&g.event_date>=new Date().toISOString().slice(0,10));return `${pageTitle('Reservas')}${r.length?r.map(gigRow).join(''):'<p class="muted">No hay reservas futuras.</p>'}<p class="muted">Una reserva cuya fecha ya haya pasado se considera automáticamente cancelada.</p>`}
function stats(){const now=new Date().getFullYear(),y=gigs.filter(g=>new Date(g.event_date).getFullYear()===now);return `${pageTitle('Estadísticas')}<div class="stats"><div class="stat"><span>Actuaciones</span><strong>${y.length}</strong></div><div class="stat"><span>Kilómetros</span><strong>${y.reduce((n,g)=>n+Number(g.kilometers||0),0).toLocaleString('es-ES')}</strong></div><div class="stat"><span>Generado</span><strong>${money(y.reduce((n,g)=>n+Number(g.bolo_price||0),0))}</strong></div></div>`}
function checklist(){return `${pageTitle('Checklist')}<p class="muted">La estructura real de checklist_items y bolo_cheklist todavía debe verificarse antes de conectar esta pantalla.</p>`}
function mapview(){return `${pageTitle('Mapa')}<div class="map-big">⌖<b>Mapa general de actuaciones</b><span>Se conectará cuando integremos el proveedor de mapas.</span></div>`}
function settingsPage(){return `${pageTitle('Ajustes')}<div class="settings"><button onclick="go('projects')"><span>🎼</span><span>Gestionar proyectos</span><span>›</span></button><button onclick="modalTravelSettings()"><span>⚙</span><span>Configuración de desplazamientos</span><span>›</span></button><button><span>👤</span><span>Cuenta</span><span>›</span></button></div><button class="secondary" style="margin-top:18px;width:100%" onclick="logout()">Cerrar sesión</button>`}
function shell(body){return `<div class="app">${header()}<main class="content">${body}</main>${bottom()}</div>`}
function render(){if(!session){root.innerHTML=`<div class="splash">${logo()}<span>Preparando Ritmo…</span></div>`;return}const pages={home,calendar,more,economy,reservations,projects:projectsView,stats,checklist,map:mapview,settings:settingsPage};root.innerHTML=shell(pages[view]?pages[view]():home())}

function modalProject(id=''){const p=id?projects.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${p?'Editar proyecto':'Nuevo proyecto'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveProject(event,'${p?.id||''}')"><label>Nombre<input id="pname" required maxlength="120" value="${esc(p?.name||'')}"></label><label>Precio predeterminado del bolo<input id="pprice" type="number" min="0" step="0.01" value="${p?.default_bolo_price??0}" required></label><label>Color<input id="pcolor" type="color" value="${p?.color||'#7b4bb7'}"></label><label>Estado<select id="pactive"><option value="true" ${p?.active!==false?'selected':''}>Activo</option><option value="false" ${p?.active===false?'selected':''}>Inactivo</option></select></label><button class="primary">${p?'Guardar cambios':'Crear proyecto'}</button><div id="projectError"></div></form></div></div>`) } 
async function saveProject(e,id=''){e.preventDefault();const err=document.getElementById('projectError');err.innerHTML='';const payload={name:document.getElementById('pname').value.trim(),color:document.getElementById('pcolor').value,default_bolo_price:Number(document.getElementById('pprice').value||0),active:document.getElementById('pactive').value==='true'};let q;if(id)q=db.from('projects').update(payload).eq('id',id).eq('user_id',session.user.id);else q=db.from('projects').insert({...payload,user_id:session.user.id});const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadProjects();render()}
async function deleteProject(id){const p=projects.find(x=>x.id===id);if(!p)return;if(!confirm(`¿Eliminar el proyecto «${p.name}»?\n\nSolo se podrá eliminar si no tiene bolos asociados.`))return;const {error}=await db.from('projects').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadProjects();render()}
function modalTravelSettings(){const existing=window.userSettings||{};document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Desplazamientos</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveTravelSettings(event)"><label>Domicilio<input id="shome" maxlength="250" value="${esc(existing.home_adress||'')}"></label><label>Velocidad media (km/h)<input id="sspeed" type="number" min="1" step="1" value="${existing.average_speed_kmh??90}"></label><label>Margen de salida (minutos)<input id="smargin" type="number" min="0" step="5" value="${existing.departure_margin_minutes??30}"></label><p class="muted">El precio por km se gestiona con su histórico de tarifas.</p><button class="primary">Guardar configuración</button><div id="settingsError"></div></form></div></div>`)}
async function loadUserSettings(){const {data,error}=await db.from('user_settings').select('user_id,home_adress,average_speed_kmh,departure_margin_minutes,created_at,updated_at').eq('user_id',session.user.id).maybeSingle();if(error){console.warn('No se pudieron cargar ajustes:',error.message);window.userSettings={};return}window.userSettings=data||{}}
async function saveTravelSettings(e){e.preventDefault();const err=document.getElementById('settingsError');err.innerHTML='';const payload={home_adress:document.getElementById('shome').value.trim(),average_speed_kmh:Number(document.getElementById('sspeed').value||0),departure_margin_minutes:Number(document.getElementById('smargin').value||0),updated_at:new Date().toISOString()};let q=window.userSettings?.user_id?db.from('user_settings').update(payload).eq('user_id',session.user.id):db.from('user_settings').insert({...payload,user_id:session.user.id});const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await loadUserSettings();closeModal();render()}
function modalBolo(id=''){if(!projects.length){alert('Primero crea un proyecto.');go('projects');return}const g=id?gigs.find(x=>String(x.id)===String(id)):null;const activeProjects=projects.filter(p=>p.active||p.id===g?.project_id);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${g?'Editar bolo':'Añadir bolo'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveBolo(event,'${g?.id||''}')"><label>Proyecto<select id="bproject">${activeProjects.map(p=>`<option value="${p.id}" ${p.id===g?.project_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Fecha<input id="bdate" type="date" required value="${g?.event_date||''}"></label><label>Estado<select id="bstatus"><option value="confirmado" ${g?.status==='confirmado'?'selected':''}>Confirmado</option><option value="reserva" ${g?.status==='reserva'?'selected':''}>Reserva</option><option value="cancelado" ${g?.status==='cancelado'?'selected':''}>Cancelado</option></select></label><label>Ubicación<input id="blocation" maxlength="200" value="${esc(g?.location||'')}"></label><label>Precio del bolo<input id="bprice" type="number" min="0" step="0.01" value="${g?.bolo_price??0}"></label><label>Kilómetros<input id="bkm" type="number" min="0" step="0.1" value="${g?.kilometers??0}"></label><label>Desplazamiento<select id="btravel"><option value="false" ${!g?.includes_travel?'selected':''}>No</option><option value="true" ${g?.includes_travel?'selected':''}>Sí</option></select></label><label>Destino<select id="bhome"><option value="true" ${g?.returns_home!==false?'selected':''}>Volver a casa</option><option value="false" ${g?.returns_home===false?'selected':''}>Otra ubicación</option></select></label><label>Otra ubicación<input id="bsleep" maxlength="200" value="${esc(g?.sleep_location||'')}"></label><label>Observaciones<textarea id="bobs">${esc(g?.observations||'')}</textarea></label><button class="primary">${g?'Guardar cambios':'Guardar bolo'}</button><div id="boloError"></div></form></div></div>`);if(!g){const first=projects.find(p=>p.active);document.getElementById('bprice').value=first?.default_bolo_price||0;document.getElementById('bdate').value=new Date().toISOString().slice(0,10)}}
async function saveBolo(e,id=''){e.preventDefault();const err=document.getElementById('boloError');err.innerHTML='';const data={user_id:session.user.id,project_id:document.getElementById('bproject').value,event_date:document.getElementById('bdate').value,status:document.getElementById('bstatus').value,location:document.getElementById('blocation').value.trim(),bolo_price:Number(document.getElementById('bprice').value||0),includes_travel:document.getElementById('btravel').value==='true',kilometers:Number(document.getElementById('bkm').value||0),returns_home:document.getElementById('bhome').value==='true',sleep_location:document.getElementById('bsleep').value.trim(),observations:document.getElementById('bobs').value.trim()};const q=id?db.from('bolos').update(data).eq('id',id).eq('user_id',session.user.id):db.from('bolos').insert(data);const {error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadGigs();render()}
async function deleteBolo(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return;if(!confirm('¿Eliminar esta actuación?'))return;const {error}=await db.from('bolos').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}view='calendar';await loadGigs();render()}
function modalCobro(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="savePayment(event)"><label>Importe<input id="payamount" type="number" min="0" step="0.01" required></label><label>Fecha<input id="paydate" type="date" required></label><label>Método<select id="paymethod"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></label><label>Observaciones<textarea id="payobs"></textarea></label><button class="primary">Registrar cobro</button><div id="payError"></div></form></div></div>`);document.getElementById('paydate').value=new Date().toISOString().slice(0,10)}
async function savePayment(e){e.preventDefault();const err=document.getElementById('payError');err.innerHTML='';const {error}=await db.from('payments').insert({user_id:session.user.id,payment_date:document.getElementById('paydate').value,amount:Number(document.getElementById('payamount').value),method:document.getElementById('paymethod').value,observations:document.getElementById('payobs').value.trim()});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
async function deletePayment(id){if(!confirm('¿Eliminar este cobro?'))return;const {error}=await db.from('payments').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadPayments();render()}
function closeModal(){document.getElementById('modal')?.remove()}
async function logout(){await db.auth.signOut();session=null;projects=[];gigs=[];login()}
function login(){root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="loginSubmit(event)"><h1>Bienvenido</h1><p class="muted">Accede a tu cuenta de Ritmo.</p><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><div id="loginError"></div><button class="primary">Iniciar sesión</button></form></div>`}
async function loginSubmit(e){e.preventDefault();const err=document.getElementById('loginError');err.innerHTML='';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)err.innerHTML=`<div class="error">${esc(error.message)}</div>`}
async function start(){const {data}=await db.auth.getSession();session=data.session;if(!session){login();return}try{await loadProjects();await loadGigs();await loadPayments();await loadUserSettings();render()}catch(e){root.innerHTML=`<div class="splash"><div class="logo">Ritmo</div><div class="error">No se han podido cargar los proyectos.<br>${esc(e.message)}</div></div>`}}
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)start();});start();
</script>
</body>
</html>

<script>
const { createClient } = supabase;
const authUrlParams=new URLSearchParams(`${window.location.search.replace(/^\?/, '')}&${window.location.hash.replace(/^#/, '')}`);
const db = createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);
const root=document.getElementById("root");
let session=null, view="home", projects=[], gigs=[], payments=[], expenses=[], passTypes=[], checklistItems=[], boloPasses=[], boloChecklist=[], allBoloPasses=[], homeNextPasses=[], kmPrices=[], adminProfiles=[], currentRole='user', syncedActivitySeenAt='', currentMonth=new Date(), selectedDay=new Date().toISOString().slice(0,10);
let invitationFlow=['invite','recovery'].includes(authUrlParams.get('type'));
let accountSetupSaving=false,accountStartPromise=null,authStartTimer=null;
function setupStorageKey(){return 'ritmo_setup_pending_'+session?.user?.id}
function hasPendingSetup(){try{return sessionStorage.getItem(setupStorageKey())==='1'}catch(_e){return false}}
function rememberPendingSetup(){try{sessionStorage.setItem(setupStorageKey(),'1')}catch(_e){}}
function clearPendingSetup(){try{sessionStorage.removeItem(setupStorageKey())}catch(_e){}}
function scheduleAccountStart(){clearTimeout(authStartTimer);authStartTimer=setTimeout(()=>{if(!accountSetupSaving)start()},0)}

function logo(){return `<div class="brand brand-image" aria-label="RITMO · Tu agenda musical"><img src="assets/ritmo-logo-editorial.png" alt="RITMO · Tu agenda musical"></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#039;"}[m]))}
function money(v){return `${Number(v||0).toFixed(2).replace('.',',')} €`}
function userInitials(){const n=window.userSettings?.display_name?.trim()||session?.user?.email?.split('@')[0]||'R';return n.split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('')}
function avatarButton(cls='top-avatar'){const url=window.userSettings?.avatar_url?.trim();return `<button class="${cls}" aria-label="Usuario" onclick="openUserMenu()">${url?`<img src="${esc(url)}" alt="">`:esc(userInitials())}</button>`}
function activityStorageKey(){return `ritmo_activity_seen_${session?.user?.id||'user'}`}
function activityLastSeen(){const raw=syncedActivitySeenAt||localStorage.getItem(activityStorageKey());if(!raw){const now=new Date().toISOString();localStorage.setItem(activityStorageKey(),now);return now}return raw}
function activityFeed(){const since=new Date(activityLastSeen()).getTime();const freshGigs=gigs.filter(g=>new Date(g.created_at||0).getTime()>since);const changedGigs=gigs.filter(g=>{const c=new Date(g.created_at||0).getTime(),u=new Date(g.updated_at||0).getTime();return u>since&&c<=since&&u>c+1000});const freshPayments=payments.filter(p=>new Date(p.created_at||0).getTime()>since);const out=[];if(freshGigs.length)out.push(['♫',`${freshGigs.length} bolo${freshGigs.length===1?' nuevo':'s nuevos'}`,freshGigs.length===1?'Se ha añadido una nueva actuación a RITMO.':'Se han añadido nuevas actuaciones a RITMO.','bolos']);if(freshPayments.length)out.push(['€',`${freshPayments.length} cobro${freshPayments.length===1?' registrado':'s registrados'}`,`Importe registrado: ${money(freshPayments.reduce((n,p)=>n+Number(p.amount||0),0))}`,'economy']);if(changedGigs.length)out.push(['↻',`${changedGigs.length} bolo${changedGigs.length===1?' actualizado':'s actualizados'}`,'Se han modificado datos de actuaciones existentes.','bolos']);return out}
function activityAlertCount(){return activityFeed().length}
function bellSvg(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>`}
function header(){const alerts=activityAlertCount();return `<header class="top"><button class="top-menu" aria-label="Abrir menú" onclick="openMainMenu()">☰</button>${logo()}<div class="top-right"><button class="top-bell" aria-label="${alerts?`${alerts} novedades`:'Sin novedades'}" onclick="openNotifications()">${bellSvg()}${alerts?'<span class="top-bell-dot"></span>':''}</button>${avatarButton()}</div></header>`}
async function markNotificationsSeen(){const now=new Date().toISOString();syncedActivitySeenAt=now;localStorage.setItem(activityStorageKey(),now);const {error}=await db.from('notification_state').upsert({user_id:session.user.id,last_seen_at:now,updated_at:now},{onConflict:'user_id'});if(error)console.warn('No se pudieron sincronizar notificaciones:',error.message)}
function openNotifications(){const feed=activityFeed();markNotificationsSeen();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal activity-modal"><div class="modal-head"><div><h2>Notificaciones</h2><div class="muted">Actividad reciente en RITMO</div></div><button onclick="closeModal();render()">✕</button></div>${feed.length?`<div class="activity-list">${feed.map(x=>`<button class="activity-item" onclick="closeModal();go('${x[3]}')"><span class="activity-icon">${x[0]}</span><div><b>${x[1]}</b><span>${x[2]}</span></div><span aria-hidden="true">›</span></button>`).join('')}</div>`:`<div class="activity-empty">✓<br><br>No hay novedades desde tu última visita.</div>`}</div></div>`)}
function openMainMenu(){const items=[['home','⌂','Inicio'],['calendar','▦','Calendario'],['bolos','♫','Bolos'],['reservations','◷','Reservas'],['economy','€','Mis cobros'],['expenses','↘','Gastos'],['map','⌖','Mapa'],['stats','▥','Estadísticas'],['projects','🎼','Proyectos'],['checklist','☑','Checklist'],['settings','⚙','Ajustes'],['admin','◉','Administración'],['refresh','↻','Actualizar datos']];const n=window.userSettings?.display_name?.trim()||'Mi cuenta';document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="mainDrawer" onclick="if(event.target===this)closeMainMenu()"><aside class="drawer"><div class="drawer-head">${logo()}<button class="drawer-close" onclick="closeMainMenu()">✕</button></div><nav class="drawer-nav">${items.map(x=>`<button onclick="closeMainMenu();${x[0]==='refresh'?'refreshApp()':`go('${x[0]}')`}"><span class="dn-icon">${x[1]}</span><span class="dn-label">${x[2]}</span><span>›</span></button>`).join('')}</nav><div class="drawer-user">${avatarButton()}<div><b>${esc(n)}</b><small>${esc(session?.user?.email||'Cuenta RITMO')}</small></div></div></aside></div>`)}
function closeMainMenu(){document.getElementById('mainDrawer')?.remove()}
function openUserMenu(){go('settings')}
function bottom(){const items=[['new-bolo','plus','Bolo'],['calendar','calendar','Calendario'],['home','home','Inicio'],['more','settings','Más'],['new-cobro','plus','Cobro']];return `<nav class="bottom" aria-label="Navegación principal">${items.map(([id,icon,label])=>`<button class="${view===id?'active':''}" onclick="${id==='new-bolo'?'modalBolo()':id==='new-cobro'?'modalCobro()':`go('${id}')`}" ${view===id?'aria-current="page"':''}>${navGlyph(icon)}<span class="bottom-label">${label}</span></button>`).join('')}</nav>`}function pageTitle(t,back=""){return `<div class="title">${back?`<button class="back" onclick="${back}">←</button>`:""}<h1>${t}</h1></div>`}
function go(v){view=v;render()}
function card(title,body,onclick=""){return `<section class="card" ${onclick?`onclick="${onclick}" style="cursor:pointer"`:''}><div class="card-head"><b>${title}</b><span class="arrow">${onclick?'›':''}</span></div>${body}</section>`}
function status(g){const paid=paymentTotalForBolo(g.id),total=boloAmounts(g).total;if(total>0&&paid>=total)return `<span class="status paid">Cobrado</span>`;if(paid>0)return `<span class="status partial">Parcial</span>`;return `<span class="status pending">Pendiente</span>`}
function boloStatusLabel(v){return v==='confirmado'?'Confirmado':v==='reserva'?'Reserva':v==='cancelado'?'Cancelado':v||''}
function boloStatusClass(v){return v==='reserva'?'reserve':v==='cancelado'?'pending':'paid'}
function projectById(id){return projects.find(p=>p.id===id)||{name:'Proyecto',color:'#7b4bb7',default_bolo_price:0}}
function paymentTotalForBolo(id){
 const g=gigs.find(x=>String(x.id)===String(id)); if(!g)return 0;
 if(g.status!=='confirmado')return 0;
 const projectGenerated=gigs.filter(x=>x.project_id===g.project_id&&x.status==='confirmado').reduce((n,x)=>n+boloAmounts(x).total,0);
 const exactPaid=payments.filter(p=>String(p.bolo_id||'')===String(id)).reduce((n,p)=>n+Number(p.amount||0),0);
 const legacyProjectPaid=payments.filter(p=>p.project_id===g.project_id&&!p.bolo_id).reduce((n,p)=>n+Number(p.amount||0),0);
 if(projectGenerated<=0)return 0;
 const boloValue=boloAmounts(g).total;
 return exactPaid+legacyProjectPaid*(boloValue/projectGenerated);
}
function paymentAllocationInfo(g){if(g?.status!=='confirmado')return 'No contabiliza';const exact=payments.filter(p=>String(p.bolo_id||'')===String(g.id)).length;if(exact)return 'Cobro asignado al bolo';const legacy=payments.some(p=>p.project_id===g.project_id&&!p.bolo_id);return legacy?'Estimación por proyecto':'Sin cobros registrados'}
function boloReadiness(g){const steps=[['Ubicación',hasCoordinates(g)],['Kilómetros',Number(g.kilometers||0)>0],['Pases',allBoloPasses.some(p=>String(p.bolo_id)===String(g.id))],['Programa',Boolean(g.program_photo_url)]];const missing=steps.filter(x=>!x[1]).map(x=>x[0]);return {steps,done:steps.length-missing.length,total:steps.length,missing}}
function boloReadinessMarkup(g){const r=boloReadiness(g),complete=r.done===r.total,label=complete?'Ficha completa':`Pendiente: ${r.missing.join(', ')}`;return `<span class="gig-readiness ${complete?'is-complete':''}" title="${esc(label)}" aria-label="${esc(label)}"><span class="gig-readiness-dots">${r.steps.map(x=>`<i class="${x[1]?'ready':'missing'}"></i>`).join('')}</span></span>`}function boloReadinessDetailMarkup(g){const r=boloReadiness(g),complete=r.done===r.total;return `<section class="bolo-readiness-detail ${complete?'is-complete':''}"><div class="bolo-readiness-summary"><div><span>FICHA DEL BOLO</span><b>${r.done}/${r.total} datos principales</b></div><span class="gig-readiness-dots" aria-label="${esc(complete?'Ficha completa':`Faltan: ${r.missing.join(', ')}`)}">${r.steps.map(x=>`<i class="${x[1]?'ready':'missing'}"></i>`).join('')}</span></div><p>${complete?'Ya tienes toda la información principal.':`Pendiente: ${esc(r.missing.join(' · '))}`}</p></section>`}
function gigRow(g){const p=projectById(g.project_id),a=boloAmounts(g);const amountLabel=g.status==='reserva'?'Previsto':g.status==='cancelado'?'Cancelado':'Total';const displayTotal=g.status==='cancelado'?0:a.total;return `<button class="row-card project-rail1321" style="--project-color:${projectRailColor1321(g)}" onclick="goGig('${g.id}')"><span class="grow"><b>${esc(p.name)}</b><small>${esc(g.event_date)} · ${esc(g.location||'Ubicación pendiente')}</small><span class="bolo-money">${amountLabel} <b>${money(displayTotal)}</b> · KM: <b>${g.includes_travel?'Sí':'No'}</b></span>${boloReadinessMarkup(g)}</span><span class="status ${boloStatusClass(g.status)}">${esc(boloStatusLabel(g.status))}</span><span class="arrow">›</span></button>`}

async function loadProjects(){
 const {data,error}=await db.from('projects').select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at').eq('user_id',session.user.id).order('name');
 if(error) throw error; projects=data||[];
}
async function loadGigs(){
 const {data,error}=await db.from('bolos').select('id,user_id,project_id,event_date,status,location,bolo_price,includes_travel,kilometers,returns_home,sleep_location,program_photo_url,travel_minutes,latitude,longitude,observations,created_at,updated_at').eq('user_id',session.user.id).order('event_date');
 if(error){console.warn('No se pudieron cargar bolos:',error.message); gigs=[];allBoloPasses=[]; return;}
 gigs=data||[];
 if(!gigs.length){allBoloPasses=[];return}
 const {data:passRows,error:passError}=await db.from('bolo_passes').select('bolo_id').in('bolo_id',gigs.map(g=>g.id));
 if(passError)console.warn('No se pudieron cargar los pases para el resumen:',passError.message);
 allBoloPasses=passRows||[];
}
async function loadExpenses(){const {data,error}=await db.from('expenses').select('id,user_id,project_id,bolo_id,expense_date,category,amount,observations').eq('user_id',session.user.id).order('expense_date',{ascending:false});expenses=data||[];if(error)console.warn(error.message)}
async function loadPayments(){const {data,error}=await db.from('payments').select('id,user_id,project_id,bolo_id,payment_date,amount,method,observations,created_at').eq('user_id',session.user.id).order('payment_date',{ascending:false});if(error){console.warn('No se pudieron cargar cobros:',error.message);payments=[];return}payments=data||[]}
async function loadExtras(){const [pt,ci,kp]=await Promise.all([db.from('pass_types').select('id,user_id,name,active,created_at').eq('user_id',session.user.id).eq('active',true).order('name'),db.from('checklist_items').select('id,user_id,name,position,active,created_at').eq('user_id',session.user.id).order('position'),db.from('km_prices').select('id,user_id,project_id,effective_from,price_per_km,created_at').eq('user_id',session.user.id).order('effective_from',{ascending:false})]);passTypes=pt.data||[];checklistItems=ci.data||[];kmPrices=kp.data||[];if(pt.error)console.warn(pt.error.message);if(ci.error)console.warn(ci.error.message);if(kp.error)console.warn(kp.error.message);}
async function loadBoloExtras(boloId){const [bp,bc]=await Promise.all([db.from('bolo_passes').select('id,bolo_id,pass_number,start_time,end_time,pass_type_id,standard_type,created_at').eq('bolo_id',boloId).order('pass_number'),db.from('bolo_checklist').select('bolo_id,checklist_item_id,checked').eq('bolo_id',boloId)]);boloPasses=bp.data||[];boloChecklist=bc.data||[];if(bp.error)console.warn(bp.error.message);if(bc.error)console.warn(bc.error.message);}
async function loadHomeNextPasses(){const g=nextGig();if(!g){homeNextPasses=[];return}const {data,error}=await db.from('bolo_passes').select('id,bolo_id,pass_number,start_time,end_time,pass_type_id,standard_type,created_at').eq('bolo_id',g.id).order('pass_number');if(error){console.warn('No se pudo cargar el primer pase del próximo bolo:',error.message);homeNextPasses=[];return}homeNextPasses=data||[]}
function totalPaid(){return payments.reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedTotal(){return gigs.reduce((n,g)=>n+economicBoloAmounts(g).total,0)}
function paidForProject(projectId){return payments.filter(p=>p.project_id===projectId).reduce((n,p)=>n+Number(p.amount||0),0)}
function generatedForProject(projectId){return gigs.filter(g=>g.project_id===projectId).reduce((n,g)=>n+economicBoloAmounts(g).total,0)}
function owedForProject(projectId){return Math.max(0,generatedForProject(projectId)-paidForProject(projectId))}
function projectEconomyRows(){return projects.map(p=>{const generated=generatedForProject(p.id),paid=paidForProject(p.id),owed=Math.max(0,generated-paid);return `<div class="project"><span class="dot" style="background:${esc(p.color||'#7b4bb7')}"></span><div class="grow"><b>${esc(p.name)}</b><small>Generado ${money(generated)} · Cobrado ${money(paid)} · Me deben ${money(owed)}</small></div></div>`}).join('')}
function unassignedPaymentsTotal(){return payments.filter(p=>!p.project_id).reduce((n,p)=>n+Number(p.amount||0),0)}function currentYearCompletion(today=localDate()){
 const y=today.slice(0,4);
 const rows=gigs.filter(g=>String(g.event_date).slice(0,4)===String(y)&&g.status!=='cancelado');
 const total=rows.length,done=rows.filter(g=>g.status==='confirmado'&&g.event_date<today).length;

 contabiliza':statusText(g)}</b></div><div class="line"><span>Asignación de cobro</span><b>${paymentAllocationInfo(g)}</b></div></div>${(()=>{const t=travelInfo(g);return `<div class="card" style="box-shadow:none"><div class="card-head"><b>Desplazamiento</b></div><div class="line"><span>Tarifa vigente</span><b>${money(t.price)}/km</b></div><div class="line"><span>Coste estimado</span><b>${money(t.cost)}</b></div><div class="line"><span>Tiempo de viaje</span><b>${g.travel_minutes?g.travel_minutes+' min':(t.minutes?t.minutes+' min':'—')}</b></div><div class="line"><span>Salida recomendada</span><b>${(()=>{const r=departureRecommendation(g,passes);return r?r.departure+' · primer pase '+r.first:(t.minutes?'Añade un pase para calcularla':'Configura km y velocidad')})()}</b></div>${g.location?`<div class="route-actions"><button class="secondary" onclick="window.open('${mapsUrl(g)}','_blank')">⌖ Abrir ruta</button><button class="secondary" onclick="navigator.clipboard?.writeText('${esc(g.location)}')">Copiar destino</button></div>`:''}</div>`})()}<div class="card" style="box-shadow:none"><div class="line"><span>Kilómetros</span><b>${Number(g.kilometers||0).toLocaleString('es-ES')} km</b></div><div class="line"><span>Destino</span><b>${g.returns_home?'Volver a casa':esc(g.sleep_location||'Otra ubicación')}</b></div><div class="line"><span>Observaciones</span><b>${esc(g.observations||'—')}</b></div></div>${g.program_photo_url?`<div class="card" style="box-shadow:none"><div class="card-head"><b>Programa y archivos</b></div><p class="muted">${isHistoric?'Bolo finalizado · el archivo solo se carga cuando lo solicitas.':'Archivo adjunto a este bolo.'}</p><button class="primary" type="button" onclick="openProgramViewer('${g.id}')">Ver programa / archivo</button></div>`:``}${(()=>{const rows=expensesForBolo(g.id),total=rows.reduce((n,x)=>n+Number(x.amount||0),0);return `<div class="card bolo-expenses" style="box-shadow:none"><div class="card-head"><b>Gastos del bolo</b><b>${money(total)}</b></div>${rows.length?rows.map(x=>`<div class="line"><span>${esc(x.category)} · ${esc(x.expense_date)}</span><b>${money(x.amount)}</b></div>`).join(''):'<p class="muted">Añade aquí los gastos de esta actuación.</p>'}<button class="secondary" style="width:100%;margin-top:10px" onclick="modalExpense('${g.id}','${g.project_id}','${g.event_date}')">＋ Registrar gasto de este bolo</button></div>`})()}<div class="card"><div class="card-head"><b>Pases</b><button class="mini" onclick="modalPass('${g.id}')">＋</button></div>${passes.length?passes.map(x=>`<div class="line"><span>Pase ${x.pass_number} · ${esc(passTypes.find(t=>t.id===x.pass_type_id)?.name||x.standard_type||'Otro')}</span><span><span class="pass-actions"><b>${esc((x.start_time||'').slice(0,5))}${x.end_time?' – '+esc(x.end_time.slice(0,5)):''}</b><button class="mini" onclick="modalPass('${g.id}','${x.id}')">✎</button><button class="mini danger" onclick="deletePass('${x.id}','${g.id}')">×</button></span></span></div>`).join(''):'<p class="muted">No hay pases añadidos.</p>'}</div><div class="card"><div class="card-head"><b>Checklist</b><span class="small">${checks.length?Math.round(checks.filter(x=>x.checked).length/checks.length*100):0}%</span></div>${checks.length?`<div class="check-progress"><progress value="${checks.filter(x=>x.checked).length}" max="${checks.length}"></progress><b>${checks.filter(x=>x.checked).length}/${checks.length}</b></div><div class="check">${checks.map(x=>`<label><input type="checkbox" ${x.checked?'checked':''} onchange="toggleChecklist('${g.id}','${x.item.id}',this.checked)"><span>${esc(x.item.name)}</span></label>`).join('')}</div>`:'<p class="muted">No hay elementos de checklist configurados.</p>'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="secondary" onclick="modalBolo('${g.id}')">✎ Editar</button><button class="secondary danger" onclick="deleteBolo('${g.id}')">Eliminar</button></div></section>`}

function economyBase(){const selected=window.economyProjectFilter||'',period=window.economyPeriod||'all',year=String(new Date().getFullYear()),matches=g=>!selected||g.project_id===selected,periodMatch=d=>economyPeriodMatch131(d,period);const scopedGigs=gigs.filter(g=>g.status==='confirmado'&&matches(g)&&periodMatch(g.event_date));const scopedPayments=payments.filter(p=>matches(p)&&periodMatch(p.payment_date));const generated=scopedGigs.reduce((n,g)=>n+boloAmounts(g).total,0),paid=scopedPayments.reduce((n,p)=>n+Number(p.amount||0),0),owed=Math.max(0,generated-paid);const options=projects.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');const months=[...new Set(gigs.map(g=>String(g.event_date).slice(0,7)).filter(Boolean))].sort().reverse();const periodOptions=`<option value="all" ${period==='all'?'selected':''}>Todo el historial</option><option value="year" ${period==='year'?'selected':''}>${year}</option>${months.map(m=>`<option value="${m}" ${m===period?'selected':''}>${new Date(m+'-01T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</option>`).join('')}`;const relation=`<div class="economy-table"><table><thead><tr><th>Bolo</th><th>Importe</th><th>Cobrado</th><th>Pend.</th></tr></thead><tbody>${scopedGigs.map(g=>{const a=boloAmounts(g),p=projectById(g.project_id),pg=Math.min(a.total,paymentTotalForBolo(g.id));return `<tr><td class="bolo-cell"><b>${esc(p.name)}</b><small>${esc(g.event_date)}</small></td><td>${money(a.total)}</td><td>${money(pg)}</td><td>${money(Math.max(0,a.total-pg))}</td></tr>`}).join('')}</tbody></table></div>`;return `${pageTitle('Mis cobros')}<div class="toolbar"><select onchange="setEconomyProject(this.value)"><option value="">Todos los proyectos</option>${options}</select><select onchange="setEconomyPeriod(this.value)">${periodOptions}</select></div><div class="stats"><div class="stat"><span>Generado</span><strong>${money(generated)}</strong></div><div class="stat"><span>Cobrado</span><strong>${money(paid)}</strong></div><div class="stat" style="grid-column:1/-1"><span>Pendiente</span><strong>${money(owed)}</strong></div></div>${card('Relación por bolo',scopedGigs.length?relation:'<p class="muted">No hay bolos confirmados en este periodo.</p>')}${card('Cobros registrados',`${scopedPayments.length?scopedPayments.map(p=>`<div class="payment-row"><div class="payment-copy"><span>${esc(p.payment_date)} · ${esc(projectById(p.project_id).name||'Sin proyecto')}</span><small>${esc(p.method||'Sin método')}</small></div><b class="payment-amount">${money(p.amount)}</b><div class="payment-actions"><button class="mini" onclick="modalAssignPayment('${p.id}')">✎</button><button class="mini danger" onclick="deletePayment('${p.id}')">×</button></div></div>`).join(''):'<p class="muted">No hay cobros registrados.</p>'}<button class="primary" style="margin-top:10px" onclick="modalCobro()">＋ Registrar cobro</button>`)} `}
function setEconomyProject(id){window.economyProjectFilter=id;render()}function setEconomyPeriod(id){window.economyPeriod=id;render()}
function debtAging(projectId=''){const today=new Date(localDate()+'T12:00:00');const buckets={fresh:0,mid:0,old:0};gigs.filter(g=>g.status==='confirmado'&&(!projectId||g.project_id===projectId)).forEach(g=>{const pending=Math.max(0,boloAmounts(g).total-paymentTotalForBolo(g.id));if(!pending)return;const days=Math.max(0,Math.floor((today-new Date(g.event_date+'T12:00:00'))/86400000));if(days<30)buckets.fresh+=pending;else if(days<=60)buckets.mid+=pending;else buckets.old+=pending});return buckets}

 return `${pageTitle('Bolos')}<p class="muted page-intro">Todas tus fechas, en un mismo lugar.</p><button class="bolos-cobros-access" onclick="go('reservations')"><span><b>◷ Reservas</b><span>Gestionar y confirmar reservas rápidamente</span></span><span class="go">${all.filter(g=>g.status==='reserva').length} ›</span></button><div class="toolbar"><select aria-label="Filtrar bolos por proyecto" onchange="window.bolosProject=this.value;render()"><option value="">Todos los proyectos</option>${projects.map(p=>`<option value="${esc(p.id)}" ${p.id===project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="filter-chips" aria-label="Estado del bolo">${opts.map(([id,label])=>`<button class="mini ${f===id?'active':''}" aria-pressed="${f===id}" onclick="setBolosFilter('${id}')">${label} <span>${all.filter(g=>id==='cancelado'?g.status==='cancelado':g.status!=='cancelado').length}</span></button>`).join('')}</div>${f!=='cancelado'?`<section class="card bolo-summary"><div class="line"><span>${moneyRows.length} ${moneyRows.length===1?'bolo confirmado':'bolos confirmados'}</span><b>${money(totals.total)}</b></div><div class="line"><span>Cachés confirmados</span><b>${money(totals.cache)}</b></div><div class="line"><span>Desplazamientos confirmados</span><b>${money(totals.travel)}</b></div><div class="line total"><span>Total a cobrar</span><b>${money(totals.total)}</b></div></section>`:'<p class="muted">Los bolos cancelados no generan ningún importe.</p>'}<p class="muted">Ordenadas por fecha${f!=='cancelado'?' · el resumen respeta los filtros activos':''}</p>${list.length?list.map(g=>`<section class="gig-card project-rail1321" style="--project-color:${projectRailColor1321(g)}">${gigRow(g)}${g.status==='reserva'?`<div class="reservation-actions"><button class="secondary" onclick="confirmReservation('${g.id}')">Confirmar reserva</button><button class="secondary danger" onclick="cancelReservation('${g.id}')">Cancelar</button></div>`:''}</section>`).join(''):' function statsBase(){
 const year=Number(window.statsYear||new Date().getFullYear());
 const selected=window.statsProjectFilter||'';

 return `${pageTitle('Estadísticas')}<div class="toolbar"><select onchange="setStatsProject(this.value)"><option value="">Todos los proyectos</option>${options}</select><select class="stats-year" onchange="setStatsYear(this.value)">${years.map(v=>`<option value="${v}" ${v===year?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="stats"><div class="stat"><span>Actuaciones · ${year}</span><strong>${s.rows.length}</strong><small class="muted">${prev.rows.length} en ${year-1}</small></div><div class="stat"><span>Kilómetros · ${year}</span><strong>${s.km.toLocaleString('es-ES')}</strong><small class="muted">${prev.km.toLocaleString('es-ES')} en ${year-1}</small></div><div class="stat"><span>Generado · ${year}</span><strong>${money(s.generated)}</strong><small class="year-compare ${change>=0?'positive':'negative'}">${change>=0?'+':''}${change}% vs ${year-1}</small></div><div class="stat"><span>Me deben · ${year}</span><strong>${money(s.owed)}</strong><small class="muted">Cobrado ${money(s.paid)}</small></div></div>

async function geocodeLocation(location,{refresh=false}={}){const query=String(location||'').trim(),key='ritmo-geocode-v2:'+query.toLocaleLowerCase('es-ES');if(!query)return null;if(!refresh)try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Number.isFinite(Number(cached.lat))&&Number.isFinite(Number(cached.lon))&&Math.abs(Number(cached.lat))<=90&&Math.abs(Number(cached.lon))<=180)return {lat:Number(cached.lat),lon:Number(cached.lon)}}catch(_e){}const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&dedupe=1&accept-language=es&q='+encodeURIComponent(query);const response=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('No se pudo localizar la dirección');const data=await response.json(),row=(data||[]).find(x=>Number.isFinite(Number(x?.lat))&&Number.isFinite(Number(x?.lon))&&Math.abs(Number(x.lat))<=90&&Math.abs(Number(x.lon))<=180);if(!row)return null;const point={lat:Number(row.lat),lon:Number(row.lon)};try{localStorage.setItem(key,JSON.stringify(point))}catch(_e){}return point}
async function initGeneralMap(){if(view!=='map'||!window.L)return;const target=document.getElementById('generalMap');if(!target||target.dataset.ready)return;target.dataset.ready='1';const map=L.map(target,{scrollWheelZoom:false,preferCanvas:true}).setView([40.4168,-3.7038],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap',updateWhenIdle:true,keepBuffer:1}).addTo(map);const statusEl=document.getElementById('mapStatus');const rows=gigs.filter(g=>g.status!=='cancelado'&&g.location?.trim());const located=rows.filter(g=>hasCoordinates(g));const pending=rows.length-located.length;if(!rows.length){statusEl.textContent='Añade una ubicación a tus bolos para verlos aquí.';return}if(!located.length){statusEl.textContent='No hay bolos con coordenadas guardadas todavía.';return}const cluster=typeof L.markerClusterGroup==='function'?L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,maxClusterRadius:48}):L.layerGroup();const bounds=[];for(const g of located){const lat=Number(g.latitude),lon=Number(g.longitude),p=projectById(g.project_id);const marker=L.circleMarker([lat,lon],{radius:9,color:p.color||'#7b4bb7',fillColor:p.color||'#7b4bb7',fillOpacity:.9,weight:2});marker.bindPopup(`<b>${esc(p.name)}</b><br>${esc(g.event_date)}<br>${esc(g.location)}<br><button onclick="goGig('${g.id}')">Ver bolo</button>`);cluster.addLayer(marker);bounds.push([lat,lon])}cluster.addTo(map);map.fitBounds(bounds,{padding:[28,28],maxZoom:12});statusEl.textContent=`${located.length} ${located.length===1?'bolo ubicado':'bolos ubicados'}${pending?` · ${pending} pendiente${pending===1?'':'s'} de coordenadas`:''}.`;}

function programFileType(url=''){const clean=String(url).split('?')[0].toLowerCase();if(clean.endsWith('.pdf'))return 'pdf';if(/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(clean))return 'image';return 'unknown'}
function openProgramViewer(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g?.program_photo_url)return;closeModal();const url=g.program_photo_url,type=programFileType(url);const body=type==='pdf'?`<iframe src="${esc(url)}#toolbar=1&navpanes=0" title="Programa PDF"></iframe>`:type==='image'?`<img src="${esc(url)}" alt="Programa del bolo">`:`<div style="padding:24px;text-align:center"><p>No puedo previsualizar este formato dentro de RITMO.</p></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal program-viewer-modal"><div class="modal-head"><div><h2>Programa</h2><div class="muted">${esc(g.location||projectById(g.project_id).name)}</div></div><button onclick="closeModal()">✕</button></div><div class="program-viewer-body">${body}</div><div class="program-viewer-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><a class="secondary" target="_blank" rel="noopener" href="${esc(url)}">Abrir original ↗</a></div></div></div>`)}
function modalBolo(id=''){if(!projects.length){alert('Primero crea un proyecto.');go('projects');return}const g=id?gigs.find(x=>String(x.id)===String(id)):null;const activeProjects=projects.filter(p=>p.active||p.id===g?.project_id);const defaultId=g?.project_id||window.userSettings?.default_project_id||activeProjects[0]?.id||'';const selectedProject=projects.find(p=>p.id===defaultId);document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>${g?'Editar bolo':'Añadir bolo'}</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveBolo(event,'${g?.id||''}')"><label>Proyecto<select id="bproject" onchange="boloProjectChanged()">${activeProjects.map(p=>`<option value="${p.id}" ${p.id===defaultId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Fecha<input id="bdate" type="date" required value="${g?.event_date||''}" onchange="updateDateConflict('${g?.id||''}')"></label><label>Estado<select id="bstatus" onchange="updateDateConflict('${g?.id||''}')"><option value="confirmado" ${g?.status==='confirmado'?'selected':''}>Confirmado</option><option value="reserva" ${g?.status==='reserva'?'selected':''}>Reserva</option><option value="cancelado" ${g?.status==='cancelado'?'selected':''}>Cancelado</option></select></label><div id="dateConflict" class="conflict-box"></div><label>Ubicación<input id="blocation" maxlength="200" value="${esc(g?.location||'')}" oninput="updateBoloMapsButton()"></label><div class="route-actions"><button type="button" id="broute" class="secondary" onclick="calculateRouteFromForm()">⌖ Calcular ruta</button><button type="button" id="bmaps" class="secondary" onclick="openBoloRouteFromForm()">Abrir Maps</button></div><p id="routeResult" class="muted">Calcula los km de ida y vuelta y el tiempo de ida desde tu domicilio.</p><label>Precio del bolo<input id="bprice" type="number" inputmode="decimal" min="0" step="0.01" value="${g?.bolo_price??selectedProject?.default_bolo_price??0}"></label><label>Kilómetros<input id="bkm" type="number" inputmode="decimal" min="0" step="0.1" value="${g?.kilometers??0}"></label><label>¿Cobrar desplazamiento aparte?<select id="btravel"><option value="false" ${!g?.includes_travel?'selected':''}>No</option><option value="true" ${g?.includes_travel?'selected':''}>Sí</option></select></label><p class="travel-charge-note">Si eliges Sí, el total a cobrar sumará kilómetros × tarifa vigente del proyecto.</p><label>Destino<select id="bhome"><option value="true" ${g?.returns_home!==false?'selected':''}>Volver a casa</option><option value="false" ${g?.returns_home===false?'selected':''}>Otra ubicación</option></select></label><label>Otra ubicación<input id="bsleep" maxlength="200" value="${esc(g?.sleep_location||'')}"></label><label>Programa, foto o documento<input id="bfile" type="file" accept="image/*,.pdf"></label>${g?.program_photo_url?`<button type="button" class="secondary" style="display:block;text-align:center;width:100%" onclick="openProgramViewer('${g.id}')">Ver archivo actual</button>`:''}<label>Observaciones<textarea id="bobs">${esc(g?.observations||'')}</textarea></label><button class="primary">${g?'Guardar cambios':'Guardar bolo'}</button><div id="boloError"></div></form></div></div>`);if(!g)document.getElementById('bdate').value=localDate();updateBoloMapsButton();updateDateConflict(g?.id||'')}
function updateDateConflict(editId=''){const box=document.getElementById('dateConflict'),date=document.getElementById('bdate')?.value,status=document.getElementById('bstatus')?.value;if(!box||!date)return;const rows=gigs.filter(g=>g.event_date===date&&g.status!=='cancelado'&&String(g.id)!==String(editId));if(!rows.length||status==='cancelado'){box.style.display='none';box.innerHTML='';return}const confirmed=rows.filter(g=>g.status==='confirmado'),reserved=rows.filter(g=>g.status==='reserva');const strong=status==='confirmado'&&confirmed.length>0;box.classList.toggle('strong',strong);box.style.display='block';box.innerHTML=`<b>${strong?'⚠ Conflicto de fecha':'◈ Fecha ocupada'}</b>${rows.map(g=>`${esc(projectById(g.project_id).name)} · ${esc(boloStatusLabel(g.status))}`).join('<br>')}<small style="display:block;margin-top:4px">Puedes guardar igualmente; RITMO no bloqueará la fecha.</small>`}
function boloProjectChanged(){const p=projects.find(x=>x.id===document.getElementById('bproject')?.value);if(p&&document.getElementById('bprice'))document.getElementById('bprice').value=Number(p.default_bolo_price||0).toFixed(2)}
function updateBoloMapsButton(){const loc=document.getElementById('blocation')?.value.trim();['bmaps','broute'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=!loc;b.style.opacity=loc?'1':'.55'}})}
async function calculateRouteFromForm(){const destination=document.getElementById('blocation')?.value.trim(),origin=window.userSettings?.home_address?.trim(),out=document.getElementById('routeResult');if(!destination||!origin){if(out)out.textContent='Configura el domicilio y la ubicación del bolo.';return}if(out)out.textContent='Calculando ruta…';try{const [a,b]=await Promise.all([geocodeLocation(origin),geocodeLocation(destination)]);if(!a||!b)throw Error();const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`),data=await r.json(),route=data.routes?.[0];if(!route)throw Error();const outboundKm=Math.round(route.distance/100)/10,totalKm=Math.round(outboundKm*2*10)/10,min=Math.round(route.duration/60);document.getElementById('bkm').value=totalKm;document.getElementById('broute').dataset.minutes=min;if(out)out.textContent=`${totalKm.toLocaleString('es-ES')} km ida y vuelta · ${min} min hasta el bolo`}catch(_e){if(out)out.textContent='No se ha podido calcular la ruta. Revisa las direcciones.'}}
async function uploadBoloFile(file,boloId){if(!file)return null;const path=`${session.user.id}/${boloId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;const {error}=await db.storage.from('ritmo-files').upload(path,file);if(error)throw error;return db.storage.from('ritmo-files').getPublicUrl(path).data.publicUrl}
function openBoloRouteFromForm(){const destination=document.getElementById('blocation')?.value.trim();if(!destination)return;const origin=window.userSettings?.home_address?.trim();if(!origin){alert('Configura primero tu domicilio en Ajustes → Configuración de desplazamientos.');return}window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=driving`,'_blank','noopener')}
async function saveBolo(e,id=''){e.preventDefault();const err=document.getElementById('boloError');err.innerHTML='';const location=document.getElementById('blocation').value.trim();const existing=id?gigs.find(g=>String(g.id)===String(id)):null;let geo=hasCoordinates(existing)?{lat:Number(existing.latitude),lon:Number(existing.longitude)}:null;if(location)try{geo=await geocodeLocation(location,{refresh:true});if(!geo)throw new Error('Sin resultados')}catch(_e){err.innerHTML='<div class="error">No se ha podido situar esta ubicación. Revisa el nombre de la localidad e inténtalo de nuevo.</div>';return}const kilometers=Number(document.getElementById('bkm').value||0),speed=Number(window.userSettings?.average_speed_kmh||0),travelMinutes=speed>0?Math.round(((kilometers/2)/speed)*60):null;const data={user_id:session.user.id,project_id:document.getElementById('bproject').value,event_date:document.getElementById('bdate').value,status:document.getElementById('bstatus').value,location,latitude:geo?.lat??null,longitude:geo?.lon??null,bolo_price:Number(document.getElementById('bprice').value||0),includes_travel:document.getElementById('btravel').value==='true',kilometers,returns_home:document.getElementById('bhome').value==='true',sleep_location:document.getElementById('bsleep').value.trim(),travel_minutes:travelMinutes,observations:document.getElementById('bobs').value.trim()};const q=id?db.from('bolos').update(data).eq('id',id).eq('user_id',session.user.id).select().single():db.from('bolos').insert(data).select().single();const {data:saved,error}=await q;if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}try{const url=await uploadBoloFile(document.getElementById('bfile')?.files?.[0],saved.id);if(url)await db.from('bolos').update({program_photo_url:url}).eq('id',saved.id).eq('user_id',session.user.id)}catch(e){err.innerHTML=`<div class="error">Bolo guardado, pero no se pudo subir el archivo: ${esc(e.message)}</div>`;return}closeModal();await loadGigs();await loadHomeNextPasses();render()}
async function deleteBolo(id){const g=gigs.find(x=>String(x.id)===String(id));if(!g)return;if(!confirm('¿Eliminar esta actuación?'))return;const {error}=await db.from('bolos').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}view='bolos';await loadGigs();await loadHomeNextPasses();render()}

function refreshPaymentBolos(selectId,projectId,selectedId=''){const el=document.getElementById(selectId);if(!el)return;el.innerHTML=`<option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(projectId,selectedId)}`}
function modalCobro(){const active=projects.filter(p=>p.active),first=active[0]?.id||'';const options=active.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Registrar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="savePayment(event)"><label>Proyecto<select id="payproject" required onchange="refreshPaymentBolos('paybolo',this.value)"><option value="">Selecciona el proyecto</option>${options}</select></label><label>Bolo exacto <small class="muted">Opcional</small><select id="paybolo"><option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(first)}</select></label><p class="muted">Al seleccionar un bolo, este cobro se reflejará exactamente en su ficha. Los cobros sin bolo se distribuyen de forma proporcional dentro del proyecto.</p><label>Importe<input id="payamount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>Fecha<input id="paydate" type="date" required></label><label>Método<select id="paymethod"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></label><label>Observaciones<textarea id="payobs"></textarea></label><button class="primary">Registrar cobro</button><div id="payError"></div></form></div></div>`);document.getElementById('paydate').value=localDate();if(first)document.getElementById('payproject').value=first;refreshPaymentBolos('paybolo',first)}
async function savePayment(e){e.preventDefault();const err=document.getElementById('payError');err.innerHTML='';const projectId=document.getElementById('payproject').value,boloId=document.getElementById('paybolo').value||null;if(boloId&&!gigs.some(g=>String(g.id)===String(boloId)&&g.project_id===projectId&&g.status==='confirmado')){err.innerHTML='<div class="error">Selecciona un bolo confirmado del proyecto.</div>';return}const {error}=await db.from('payments').insert({user_id:session.user.id,project_id:projectId,bolo_id:boloId,payment_date:document.getElementById('paydate').value,amount:Number(document.getElementById('payamount').value),method:document.getElementById('paymethod').value,observations:document.getElementById('payobs').value.trim()});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
function modalAssignPayment(id){const p=payments.find(x=>x.id===id);if(!p)return;const available=projects.filter(x=>x.active||x.id===p.project_id),projectId=p.project_id||available[0]?.id||'';const options=available.map(x=>`<option value="${x.id}" ${x.id===projectId?'selected':''}>${esc(x.name)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Asignar cobro</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="assignPayment(event,'${id}')"><p class="muted">${money(p.amount)} · ${esc(p.payment_date)}</p><label>Proyecto<select id="assignproject" required onchange="refreshPaymentBolos('assignbolo',this.value)"><option value="">Selecciona el proyecto</option>${options}</select></label><label>Bolo exacto <small class="muted">Opcional</small><select id="assignbolo"><option value="">Sin asignar a un bolo exacto</option>${paymentBoloOptions(projectId,p.bolo_id)}</select></label><p class="muted">Puedes dejarlo sin bolo para conservar la asignación proporcional por proyecto.</p><button class="primary">Guardar asignación</button><div id="assignError"></div></form></div></div>`);refreshPaymentBolos('assignbolo',projectId,p.bolo_id)}
async function assignPayment(e,id){e.preventDefault();const err=document.getElementById('assignError');const projectId=document.getElementById('assignproject').value,boloId=document.getElementById('assignbolo').value||null;if(boloId&&!gigs.some(g=>String(g.id)===String(boloId)&&g.project_id===projectId&&g.status==='confirmado')){err.innerHTML='<div class="error">Selecciona un bolo confirmado del proyecto.</div>';return}const {error}=await db.from('payments').update({project_id:projectId,bolo_id:boloId}).eq('id',id).eq('user_id',session.user.id);if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}closeModal();await loadPayments();render()}
async function deletePayment(id){if(!confirm('¿Eliminar este cobro?'))return;const {error}=await db.from('payments').delete().eq('id',id).eq('user_id',session.user.id);if(error){alert(`No se ha podido eliminar: ${error.message}`);return}await loadPayments();render()}
function closeModal(){document.getElementById('modal')?.remove()}
async function logout(){await db.auth.signOut();session=null;projects=[];gigs=[];login()}
function needsAccountSetup(){return Boolean(session&&(invitationFlow||hasPendingSetup()||session.user?.user_metadata?.requires_onboarding===true||!window.userSettings?.user_id))}
function accountSetup(){rememberPendingSetup();const suggested=session?.user?.user_metadata?.name||session?.user?.email?.split('@')[0]||'';root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="finishAccountSetup(event)"><h1>Completa tu acceso</h1><p class="muted">Tu invitación está lista. Elige cómo quieres aparecer en RITMO y crea una contraseña para volver a entrar cuando quieras.</p><label>Nombre artístico o nombre<input id="setupName" maxlength="80" required value="${esc(suggested)}"></label><label>Crea una contraseña<input id="setupPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Repite la contraseña<input id="setupPasswordRepeat" type="password" minlength="8" autocomplete="new-password" required></label><div id="setupError"></div><button id="setupSubmit" class="primary">Guardar y entrar</button></form></div>`}
async function finishAccountSetup(e){
 e.preventDefault();if(accountSetupSaving)return;
 const err=document.getElementById('setupError'),button=document.getElementById('setupSubmit'),name=document.getElementById('setupName').value.trim(),password=document.getElementById('setupPassword').value,repeat=document.getElementById('setupPasswordRepeat').value;
 err.innerHTML='';if(!name){err.innerHTML='<div class="error">Escribe el nombre que quieres mostrar.</div>';return}if(password.length<8){err.innerHTML='<div class="error">La contraseña debe tener al menos 8 caracteres.</div>';return}if(password!==repeat){err.innerHTML='<div class="error">Las contraseñas no coinciden.</div>';return}
 accountSetupSaving=true;rememberPendingSetup();clearTimeout(authStartTimer);button.disabled=true;button.textContent='Guardando…';
 try{
  const {error:settingsError}=await db.from('user_settings').upsert({user_id:session.user.id,display_name:name,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(settingsError)throw settingsError;
  const {data,error:authError}=await db.auth.updateUser({password,data:{name,requires_onboarding:false,tour_seen_version:session.user.user_metadata?.tour_seen_version||0,setup_hidden:session.user.user_metadata?.setup_hidden||false,onboarding_completed_at:new Date().toISOString()}});if(authError)throw authError;if(data?.user)session.user=data.user;
  invitationFlow=false;clearPendingSetup();window.history.replaceState({},document.title,window.location.origin+window.location.pathname);accountSetupSaving=false;await start();
 }catch(error){accountSetupSaving=false;button.disabled=false;button.textContent='Guardar y entrar';err.innerHTML=`<div class="error">No se ha podido completar tu acceso: ${esc(error.message)}. Vuelve a intentarlo.</div>`}
}
function login(){root.innerHTML=`<div class="login"><div class="login-art">${logo()}<p>Tu música, en orden.</p></div><form class="login-card" onsubmit="loginSubmit(event)"><h1>Bienvenido</h1><p class="muted">Accede a tu cuenta de Ritmo.</p><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><div id="loginError"></div><button class="primary">Iniciar sesión</button></form></div>`}
async function loginSubmit(e){e.preventDefault();view='home';window.currentGigId=null;const err=document.getElementById('loginError');err.innerHTML='';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)err.innerHTML=`<div class="error">${esc(error.message)}</div>`}
async function start(){if(accountSetupSaving)return;if(accountStartPromise)return accountStartPromise;accountStartPromise=startAccount();try{await accountStartPromise}finally{accountStartPromise=null}}
async function startAccount(){
 const {data}=await db.auth.getSession();session=data.session;if(!session){window.userSettings={};login();return}view='home';
 try{
  const {data:userData,error:userError}=await db.auth.getUser();if(userError||!userData?.user)throw userError||new Error('No se ha podido comprobar tu sesión');session.user=userData.user;
  await loadUserSettings();if(needsAccountSetup()){accountSetup();return}
  await loadProjects();await loadGigs();await loadPayments();await loadExpenses();await loadExtras();await loadHomeNextPasses();await loadAccountRole();await Promise.all([loadNotificationState(),loadAdminProfiles()]);render();
 }catch(e){root.innerHTML=`<div class="splash">${logo()}<div class="error">No se ha podido preparar tu cuenta.<br>${esc(e.message)}</div><button class="primary" onclick="start()">Volver a intentar</button></div>`}
}
function syncModalViewport(){const vp=window.visualViewport;document.documentElement.style.setProperty('--modal-height',(vp?vp.height:window.innerHeight)+'px');document.documentElement.style.setProperty('--modal-top',(vp?vp.offsetTop:0)+'px')}
window.visualViewport?.addEventListener('resize',syncModalViewport);window.visualViewport?.addEventListener('scroll',syncModalViewport);syncModalViewport();
</script>

<script>db.auth.onAuthStateChange((event,s)=>{const previousUserId=session?.user?.id;session=s;if(event==='PASSWORD_RECOVERY')invitationFlow=true;if(accountSetupSaving)return;if(event==='SIGNED_OUT'){sessionStorage.removeItem('ritmo-place134');restoredPlace134=false;invitationFlow=false;window.userSettings={};login();return}if(s&&previousUserId===s.user.id&&dataOwner131===s.user.id&&!needsAccountSetup()&&['SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event))return;if(s&&previousUserId===s.user.id&&document.getElementById('setupSubmit')&&needsAccountSetup())return;if(s&&['INITIAL_SESSION','SIGNED_IN','PASSWORD_RECOVERY','USER_UPDATED'].includes(event))scheduleAccountStart()});scheduleAccountStart();
</script>

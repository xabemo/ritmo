<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>RITMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--green:#173f35;--green2:#2e6b59;--cream:#f5f1e8;--card:#fffdf8;--muted:#6e7b76;--line:#dfe3dc;--red:#9b3e3e}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#18332d;font-family:"DM Sans",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:30px}.top{height:70px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:#f5f1e8ee;backdrop-filter:blur(14px)}
.logo{font-family:"Playfair Display",serif;font-size:32px;font-weight:600;letter-spacing:-1px;display:flex;align-items:center}.staff{font-family:serif;color:var(--green2);font-size:27px;margin-right:-5px;transform:rotate(-8deg)}
.content{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:0 5px 18px #173f350b;padding:18px;margin:12px 0}.muted{color:var(--muted);font-size:13px}.title{display:flex;align-items:center;gap:8px;margin:8px 0 18px}.title h1{font-size:26px;margin:0}.welcome{background:var(--green);color:white;border-radius:20px;padding:22px;margin-bottom:14px}.welcome .eyebrow{opacity:.75;font-size:11px;font-weight:700;letter-spacing:.12em}.welcome h1{margin:5px 0 8px;font-size:27px}.welcome p{margin:0;opacity:.8;font-size:13px}.project{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:9px 0}.dot{width:11px;height:11px;border-radius:50%;flex:none}.grow{flex:1;min-width:0}.project b{display:block}.project small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.error{background:#f7dddd;color:var(--red);padding:11px;border-radius:10px;font-size:13px;margin:12px 0;word-break:break-word}.success{background:#e1f2e6;color:#2d7045;padding:11px;border-radius:10px;font-size:13px;margin:12px 0}.login{min-height:100vh;background:var(--green);display:grid;grid-template-columns:1fr 1fr}.login-art{display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;padding:25px}.login-art .logo{font-size:68px}.login-art p{opacity:.75;text-align:center;max-width:300px}.login-card{background:var(--cream);align-self:center;margin:30px;padding:30px;border-radius:24px;max-width:430px}.login-card h1{margin:0 0 6px}.login-card p{color:var(--muted);font-size:13px;margin-top:0}.login-card label{display:block;font-size:12px;font-weight:700;margin:15px 0}.login-card input{width:100%;padding:13px;margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:#18332d}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700}.primary:disabled{opacity:.6;cursor:wait}.logout{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--green);font-weight:600;margin-top:18px} .project-actions{display:flex;gap:8px;align-items:center}.add-project{border:0;border-radius:12px;padding:10px 13px;background:var(--green);color:#fff;font-weight:700}.project{display:flex;align-items:center;gap:12px}.project .dot{width:13px;height:13px;border-radius:50%;flex:none}.project .grow{min-width:0;flex:1}.project .grow b{display:block}.project .grow small{display:block;color:var(--muted);margin-top:4px}.project-card{padding:15px}.empty{text-align:center;padding:22px 10px;color:var(--muted)}.empty h3{color:#18332d;margin-bottom:6px}.empty p{margin:0 0 15px}.modal-bg{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:12px}.modal{width:min(100%,560px);background:var(--card);border-radius:22px;padding:18px;box-shadow:0 20px 60px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-head h2{margin:0}.modal-head button{border:0;background:transparent;font-size:22px;color:var(--green)}.form label{display:block;font-size:12px;font-weight:700;margin:11px 0}.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#18332d;margin-top:5px}.color-row{display:flex;align-items:center;gap:10px}.color-row input[type=color]{width:54px;height:42px;padding:3px}.modal-error{background:#f7dddd;color:#8b3434;padding:9px;border-radius:9px;font-size:12px;margin:10px 0}.modal-note{font-size:12px;color:var(--muted);margin-top:5px}.top button{border:0;background:transparent;color:var(--green);font-size:20px}.splash{height:100vh;background:var(--green);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.splash .logo{font-size:62px}.spinner{width:22px;height:22px;border:3px solid #ffffff44;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.login{display:block}.login-art{min-height:34vh}.login-art .logo{font-size:50px}.login-card{margin:-18px 16px 0;position:relative}}
</style>
</head>
<body>
<div id="root"><div class="splash"><div class="logo"><span class="staff">♪</span>Ritmo</div><div class="spinner"></div></div></div>

<!-- IMPORTANTE: config.js es un archivo externo existente en la raíz del proyecto. NO sustituirlo. -->
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const root = document.getElementById('root');
let db = null;
let session = null;
let projects = [];

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function logo(){
  return '<div class="logo"><span class="staff">♪</span>Ritmo</div>';
}

function showFatal(message){
  root.innerHTML = '<div class="login"><div class="login-art">'+logo()+'<p>Gestión de actuaciones, proyectos y economía.</p></div><div class="login-card"><h1>RITMO</h1><div class="error">'+esc(message)+'</div></div></div>';
}

function showLogin(errorMessage=''){
  root.innerHTML = `
    <div class="login">
      <div class="login-art">
        ${logo()}
        <p>Gestiona tus actuaciones, proyectos y cobros desde un único lugar.</p>
      </div>
      <div class="login-card">
        <h1>Iniciar sesión</h1>
        <p>Accede a tu cuenta de RITMO.</p>
        ${errorMessage ? `<div class="error">${esc(errorMessage)}</div>` : ''}
        <form id="loginForm">
          <label>Correo electrónico
            <input id="loginEmail" type="email" autocomplete="email" required>
          </label>
          <label>Contraseña
            <input id="loginPassword" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" id="loginButton" type="submit">Entrar</button>
        </form>
      </div>
    </div>`;

  document.getElementById('loginForm').addEventListener('submit', loginSubmit);
}

async function loginSubmit(event){
  event.preventDefault();
  const button = document.getElementById('loginButton');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  button.disabled = true;
  button.textContent = 'Entrando…';

  const { error } = await db.auth.signInWithPassword({email, password});
  if(error){
    showLogin(error.message);
    return;
  }
}

function renderApp(){
  root.innerHTML = `
    <div class="app">
      <header class="top">${logo()}<button type="button" id="logoutButton" title="Cerrar sesión">↪</button></header>
      <main class="content">
        <section class="welcome">
          <div class="eyebrow">RITMO</div>
          <h1>Hola${session?.user?.email ? ', '+esc(session.user.email) : ''}</h1>
          <p>Tu cuenta está conectada correctamente a Supabase.</p>
        </section>

        <div class="title" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h1 style="margin:0">Proyectos</h1><button class="add-project" type="button" onclick="openProjectModal()">＋ Crear</button></div>
        <div id="projectsArea">
          <section class="card"><div class="empty">Cargando proyectos…</div></section>
        </div>
        <button class="logout" id="logoutButtonBottom">Cerrar sesión</button>
      </main>
    </div>`;

  document.getElementById('logoutButton').addEventListener('click', logout);
  document.getElementById('logoutButtonBottom').addEventListener('click', logout);
}

function renderProjects(){
  const area = document.getElementById('projectsArea');
  if(!area) return;

  if(!projects.length){
    area.innerHTML = `
      <section class="card project-card">
        <div class="empty">
          <div style="font-size:34px;margin-bottom:8px">🎼</div>
          <h3>Aún no tienes proyectos</h3>
          <p>Crea tu primer proyecto para empezar a organizar tus actuaciones.</p>
          <button class="add-project" type="button" onclick="openProjectModal()">＋ Crear proyecto</button>
        </div>
      </section>`;
    return;
  }

  area.innerHTML = projects.map(project => `
    <section class="card project-card project">
      <span class="dot" style="background:${esc(project.color || '#2e6b59')}"></span>
      <div class="grow">
        <b>${esc(project.name || 'Proyecto sin nombre')}</b>
        <small>${project.active === false ? 'Inactivo' : 'Activo'}${project.default_bolo_price != null ? ' · Precio predeterminado: '+esc(project.default_bolo_price)+' €' : ''}</small>
      </div>
    </section>`).join('');
}

function openProjectModal(){
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="projectModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
        <div class="modal-head">
          <h2 id="projectModalTitle">Nuevo proyecto</h2>
          <button type="button" onclick="closeProjectModal()" aria-label="Cerrar">✕</button>
        </div>
        <form id="projectForm" class="form">
          <label>Nombre del proyecto
            <input id="projectName" type="text" maxlength="100" placeholder="Ej. Orquesta Juniors" required>
          </label>
          <label>Precio predeterminado del bolo (€)
            <input id="projectPrice" type="number" min="0" step="0.01" placeholder="Ej. 175">
            <div class="modal-note">Se utilizará como precio inicial al crear un bolo de este proyecto.</div>
          </label>
          <label>Color del proyecto
            <span class="color-row"><input id="projectColor" type="color" value="#8B5CF6"><span id="projectColorValue">#8B5CF6</span></span>
          </label>
          <div id="projectError"></div>
          <button class="primary" id="saveProjectButton" type="submit">Crear proyecto</button>
        </form>
      </div>
    </div>`);

  const color = document.getElementById('projectColor');
  color.addEventListener('input', () => document.getElementById('projectColorValue').textContent = color.value.toUpperCase());
  document.getElementById('projectForm').addEventListener('submit', createProject);
  setTimeout(() => document.getElementById('projectName')?.focus(), 50);
}

function closeProjectModal(){
  document.getElementById('projectModal')?.remove();
}

async function createProject(event){
  event.preventDefault();
  const button = document.getElementById('saveProjectButton');
  const errorBox = document.getElementById('projectError');
  const name = document.getElementById('projectName').value.trim();
  const priceRaw = document.getElementById('projectPrice').value.trim();
  const color = document.getElementById('projectColor').value;

  if(!name){
    errorBox.innerHTML = '<div class="modal-error">El nombre del proyecto es obligatorio.</div>';
    return;
  }

  const defaultPrice = priceRaw === '' ? null : Number(priceRaw);
  if(defaultPrice !== null && (!Number.isFinite(defaultPrice) || defaultPrice < 0)){
    errorBox.innerHTML = '<div class="modal-error">El precio debe ser un número válido igual o superior a 0.</div>';
    return;
  }

  button.disabled = true;
  button.textContent = 'Guardando…';
  errorBox.innerHTML = '';

  const { data, error } = await db.from('projects').insert({
    user_id: session.user.id,
    name,
    color,
    default_bolo_price: defaultPrice,
    active: true
  }).select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at').single();

  if(error){
    console.error(error);
    button.disabled = false;
    button.textContent = 'Crear proyecto';
    errorBox.innerHTML = '<div class="modal-error"><b>No se ha podido crear el proyecto.</b><br>'+esc(error.message)+'</div>';
    return;
  }

  projects = [data, ...projects];
  closeProjectModal();
  renderProjects();
}

async function loadProjects(){
  if(!session?.user?.id){
    showLogin();
    return;
  }

  renderApp();

  // Solo columnas confirmadas de la tabla projects.
  const { data, error } = await db
    .from('projects')
    .select('id,user_id,name,color,logo_url,default_bolo_price,active,created_at,updated_at')
    .eq('user_id', session.user.id)
    .order('created_at', {ascending:true});

  if(error){
    document.getElementById('projectsArea').innerHTML = `<section class="card"><div class="error"><b>No se han podido cargar los proyectos.</b><br>${esc(error.message)}</div></section>`;
    return;
  }

  projects = data || [];
  renderProjects();
}

async function logout(){
  await db.auth.signOut();
}

async function init(){
  // 1. Verificar que config.js realmente se ha cargado.
  if(typeof RITMO_CONFIG === 'undefined' || !RITMO_CONFIG || !RITMO_CONFIG.url || !RITMO_CONFIG.key){
    showFatal('No se ha encontrado RITMO_CONFIG. Comprueba que config.js está en la raíz del repositorio y que GitHub Pages lo publica junto a index.html.');
    return;
  }

  // 2. Verificar que la librería de Supabase se ha cargado.
  if(typeof window.supabase === 'undefined' || typeof window.supabase.createClient !== 'function'){
    showFatal('No se ha podido cargar la librería de Supabase. Comprueba la conexión a Internet y vuelve a cargar RITMO.');
    return;
  }

  db = window.supabase.createClient(RITMO_CONFIG.url, RITMO_CONFIG.key);

  // 3. Recuperar sesión existente.
  const {data, error} = await db.auth.getSession();
  if(error){
    showFatal('Error al recuperar la sesión de Supabase: '+error.message);
    return;
  }

  session = data.session;
  if(session){
    await loadProjects();
  }else{
    showLogin();
  }

  // 4. Mantener la UI sincronizada con login/logout.
  db.auth.onAuthStateChange(async (_event, newSession) => {
    session = newSession;
    if(session){
      await loadProjects();
    }else{
      projects = [];
      showLogin();
    }
  });
}

init().catch(error => {
  console.error(error);
  showFatal('Error inesperado al iniciar RITMO: '+(error?.message || error));
});
</script>
</body>
</html>
